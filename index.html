.shell{width:min(1400px,calc(100% - 48px));margin:auto}

/* ---------- Analysis Mode Chrome & Base Styles ---------- */
.masthead{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding:34px 0 22px;border-bottom:1px solid var(--line)}
.eyebrow{color:#a8c6d6;font-size:.74rem;font-weight:800;letter-spacing:.16em;margin:0 0 8px;text-transform:uppercase}
h1{font-size:clamp(1.9rem,4vw,3.6rem);line-height:1.1;letter-spacing:-.04em;margin:0;font-weight:900;overflow-wrap:anywhere}h1 em{color:var(--surya);font-style:normal}
.subhead{color:var(--muted);margin:10px 0 0}
.head-actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.head-actions>*{font-size:.82rem;font-weight:700;border:1px solid var(--line);background:#193249;border-radius:999px;color:var(--text);padding:9px 15px;white-space:nowrap}
.head-actions button.primary-pill{background:var(--surya);color:#122232;border-color:var(--surya)}
.head-actions button.primary-pill:hover{filter:brightness(1.06)}
.banner{display:flex;gap:8px 22px;flex-wrap:wrap;align-items:center;padding:12px 16px;border:1px solid #e8bd7240;background:#e8bd7209;border-radius:10px;color:#c2cbd5;font-size:.8rem;margin:18px 0 0}
.banner strong{color:var(--surya)}.banner b{color:var(--text);font-variant-numeric:tabular-nums}
.banner[hidden]{display:none}.stale{border-color:#f29e9e66;background:#f29e9e12;color:#ffd9d9}
.sticky{position:sticky;top:0;z-index:20;background:#0b1725f2;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand-nav{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;padding:12px 0 8px;flex-wrap:wrap}
.tabs{display:flex;gap:7px;flex-shrink:0;max-width:100%;overflow:auto}
.tab{border:1px solid var(--line);border-radius:12px;background:transparent;color:#e7eff2;text-align:left;font-weight:800;padding:7px 14px;white-space:nowrap}
.tab small{display:block;color:var(--quiet);font-size:.68rem;font-weight:600}
.tab[aria-pressed=true]{background:#f0f4ef;color:#12283b;border-color:#f0f4ef}.tab[aria-pressed=true] small{color:#526b7b}
.tab[data-brand="SURYA"][aria-pressed=true]{background:var(--surya-brown);color:#FFF9EE;border-color:var(--surya)}.tab[data-brand="SURYA"][aria-pressed=true] small{color:#f2dfcc}.tab[data-brand^="Monster"][aria-pressed=true]{background:var(--monster);border-color:var(--monster2);box-shadow:inset 0 -4px 0 var(--monster2)}
.scope{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:end}
.scope label,.filters label{font-size:.68rem;color:var(--quiet);display:flex;flex-direction:column;gap:2px}
.scope label.chk{flex-direction:row;align-items:center;gap:7px;font-size:.78rem;color:var(--muted);padding-bottom:6px}.chk input{accent-color:var(--surya);width:16px;height:16px}
select,input[type=date],input[type=search]{font-size:.82rem;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:#122334;color:var(--text);min-width:0}
.jump{display:flex;gap:18px;overflow:auto;padding:4px 0 10px;white-space:nowrap;font-size:.76rem}.jump a{color:var(--quiet)}.jump a:hover{color:var(--surya)}
section{margin-top:46px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:16px}
.section-head h2{font-size:clamp(1.4rem,2.4vw,2.1rem);letter-spacing:-.03em;line-height:1.2;margin:0}
.section-head>p{font-size:.8rem;color:var(--muted);max-width:420px;text-align:right;margin:0}
h3{font-size:1rem;margin:22px 0 10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:17px 19px;min-width:0}
.insight{background:linear-gradient(155deg,#1d374c,#14283b);border:1px solid var(--line);border-radius:16px;padding:18px 20px 18px 24px;position:relative;overflow:hidden}
.insight:before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--accent,var(--surya))}
.insight p{font-size:.9rem;color:#d6e2e8;margin:8px 0 0}.insight small{display:block;color:var(--quiet);font-size:.72rem;margin-top:10px}
.kind{font-size:.68rem;font-weight:800;letter-spacing:.08em;padding:2px 9px;border-radius:6px;display:inline-block;margin-right:6px;text-transform:uppercase}
.kind.verified{background:#74d3b024;color:#9be6c8}.kind.hypothesis{background:#e8bd7224;color:#f3d39a}.kind.inference{background:#b99cf024;color:#d3c1f7}.kind.experiment,.kind.decision{background:#70d8ed24;color:#a8e9f5}
.kind.disagree,.kind.high{background:#f29e9e24;color:#ffc4c4}.kind.partial,.kind.minor,.kind.medium{background:#e8bd7224;color:#f3d39a}.kind.agree,.kind.low{background:#74d3b024;color:#9be6c8}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:.68rem;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted);white-space:nowrap}
.badge i{width:8px;height:8px;border-radius:50%;flex-shrink:0}.b-Instagram i{background:var(--ig)}.b-Facebook i{background:var(--fb)}.b-TikTok i{background:var(--tt)}
.bn{font-size:.72rem;letter-spacing:.1em;font-weight:900;color:var(--accent)}
.bn-wrap{display:inline-flex;align-items:center;gap:7px}
.bmark{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;line-height:0}
.SURYA{--accent:#d08e52;--mark:#9e5a24;--brand-bg:rgba(118,67,28,.24);--brand-line:rgba(197,130,70,.45)}.Monster{--accent:var(--monster);--mark:var(--monster-blue);--brand-bg:rgba(56,83,151,.22);--brand-line:rgba(126,164,245,.38)}
.card.SURYA,.insight.SURYA{border-top:3px solid var(--surya-brown);box-shadow:inset 0 2px 0 rgba(197,130,70,.35);background:linear-gradient(180deg,var(--brand-bg) 0,transparent 84px),var(--panel)}
.card.Monster,.insight.Monster{border-top:3px solid var(--monster-blue);box-shadow:inset 0 2px 0 rgba(254,211,71,.35);background:linear-gradient(180deg,var(--brand-bg) 0,transparent 84px),var(--panel)}
.plat-Instagram{--plat-rgb:249,115,22;--plat-stroke:rgba(249,115,22,.62);--plat-tint:rgba(249,115,22,.075)}
.plat-Facebook{--plat-rgb:59,130,246;--plat-stroke:rgba(59,130,246,.65);--plat-tint:rgba(59,130,246,.08)}
.plat-TikTok{--plat-rgb:168,85,247;--plat-stroke:rgba(168,85,247,.65);--plat-tint:rgba(168,85,247,.08)}
.card.plat-Instagram,.card.plat-Facebook,.card.plat-TikTok,
.post.plat-Instagram,.post.plat-Facebook,.post.plat-TikTok{border:1.5px solid var(--plat-stroke);background:linear-gradient(0deg,var(--plat-tint),var(--plat-tint)),var(--panel)}
.card.SURYA.plat-Instagram,.card.SURYA.plat-Facebook,.card.SURYA.plat-TikTok{border-top:3px solid var(--surya-brown);box-shadow:inset 0 2px 0 rgba(197,130,70,.35);background:linear-gradient(180deg,var(--brand-bg) 0,transparent 84px),linear-gradient(0deg,var(--plat-tint),var(--plat-tint)),var(--panel)}
.card.Monster.plat-Instagram,.card.Monster.plat-Facebook,.card.Monster.plat-TikTok{border-top:3px solid var(--monster-blue);background:linear-gradient(180deg,var(--brand-bg) 0,transparent 84px),linear-gradient(0deg,var(--plat-tint),var(--plat-tint)),var(--panel)}
.p-brand-hero{display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap}
.p-brand-tag{font-size:14px;font-weight:800;letter-spacing:.06em;padding:4px 12px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
.p-brand-tag.SURYA{background:#76431C;color:#FFF9EE;border:1px solid #c58246}
.p-brand-tag.Monster{background:#385397;color:#FFF7D6;border:1px solid #FED347}
.kpi header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpi .big{font-size:clamp(1.7rem,2.6vw,2.3rem);font-weight:800;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums;margin-top:12px}
.kpi .unit{color:var(--muted);font-size:.74rem}
.delta{font-size:.74rem;padding:3px 8px;border-radius:6px;background:#ffffff0d;margin-left:6px;white-space:nowrap;display:inline-block}.up{color:var(--up)}.down{color:var(--down)}
.barline{display:grid;grid-template-columns:62px 1fr 64px;align-items:center;gap:8px;font-size:.7rem;color:var(--muted);margin-top:5px}
.track{height:9px;border-radius:20px;background:#294253;overflow:hidden}.fill{height:100%;border-radius:4px;background:var(--mark)}.fill.prev{background:var(--prev)}
.barline b{color:#e5eff2;text-align:right;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:12px}
.stats span{display:block;color:var(--quiet);font-size:.68rem}.stats b{font-size:.86rem;font-variant-numeric:tabular-nums}
.fine{color:var(--quiet);font-size:.72rem;margin:10px 0 0}.caution{color:var(--warn);font-size:.72rem;margin:6px 0 0}
.spark{display:flex;gap:4px;align-items:flex-end;height:44px;margin-top:12px}.spark i{flex:1;background:var(--mark);border-radius:3px 3px 0 0;min-height:3px;opacity:.88;transition:opacity .15s}
.spark i:hover{opacity:1}
.lab{background:#102538;border:1px solid var(--line);border-radius:20px;padding:22px}
.filters{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:end;margin-bottom:6px}.filters input[type=search]{width:220px}
.hint{color:var(--quiet);font-size:.74rem;margin:6px 0 14px}
.post{background:linear-gradient(145deg,var(--brand-bg),#102338);border:1px solid var(--brand-line);border-radius:14px;padding:15px;min-width:0;display:flex;flex-direction:column;gap:9px}
.thumb{aspect-ratio:4/3;border-radius:10px;background:#15283a;display:grid;place-items:center;overflow:hidden;color:var(--quiet);font-size:.72rem;text-align:center;border:1px dashed var(--line);padding:8px}
.thumb img{width:100%;height:100%;object-fit:contain}.thumb.has{border-style:solid;padding:0}
.rank{color:var(--surya);letter-spacing:.1em;font-size:.7rem;font-weight:800}
.post h4{font-size:.92rem;line-height:1.5;margin:0;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:.68rem;color:var(--quiet);align-items:center}
.pm{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.pm span{font-size:.64rem;color:var(--quiet);display:block}.pm b{font-size:.95rem;font-variant-numeric:tabular-nums}
.row .thumb{width:76px;aspect-ratio:1;flex-shrink:0}.row .top{display:flex;gap:12px;align-items:flex-start}
.more{text-align:center;margin:18px 0 0}.more button{background:#1d3b52;color:#d3e5f0;border:1px solid #537186;padding:9px 22px;border-radius:8px}
.pattern{padding:20px;border:1px solid #25384a;background:#0e1e2f;border-radius:14px}.pattern .fact{font-size:1.35rem;color:var(--accent);line-height:1.35;margin:8px 0;font-weight:700}
.pattern p{font-size:.82rem;color:#aebdcd;margin:0}.pattern .lbl{color:var(--accent);font-size:.66rem;letter-spacing:.14em;font-weight:800}
ul.ins{list-style:none;padding:0;margin:0}ul.ins li{padding:9px 0;border-bottom:1px solid #ffffff10;font-size:.86rem;color:#d1dee5}ul.ins li:last-child{border:0}
.exp h3{margin:8px 0;font-size:1.05rem;line-height:1.45}.exp p{font-size:.84rem;color:#acbbcb;margin:0 0 10px}.exp .measure{color:var(--surya);font-size:.76rem;border-top:1px solid #ffffff10;padding-top:10px;margin:0}
.scroll{overflow:auto;border:1px solid #25384a;border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.78rem}
th,td{padding:9px 12px;border-bottom:1px solid #ffffff0d;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;color:#cad5df}
th{color:var(--quiet);font-weight:600;background:#112234;font-size:.7rem}
th:first-child,td:first-child,.l{text-align:left}td.wrap{white-space:normal;min-width:230px;text-align:left}tr.thin td{color:#7f93a5}
details{border:1px solid #2b3c4e;border-radius:12px;padding:14px 16px;margin-top:14px}summary{cursor:pointer;color:var(--surya);font-size:.86rem}
.legend{display:flex;gap:16px;font-size:.76rem;color:var(--muted);margin:0 0 10px;flex-wrap:wrap}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
svg text{font:11px "Leelawadee UI","Segoe UI",sans-serif;fill:var(--muted)}
#tip{position:fixed;pointer-events:none;background:#f0f4ef;color:#12283b;font-size:.82rem;padding:7px 11px;border-radius:8px;display:none;z-index:200;max-width:280px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.empty{padding:28px;text-align:center;color:var(--quiet)}
footer{margin:50px 0 40px;color:var(--quiet);font-size:.74rem;border-top:1px solid var(--line);padding-top:16px}

/* ---------- Mode Visibility ---------- */
body.present-mode #analysis-chrome,
body.present-mode #foot{display:none}
body.analysis-mode #present-chrome{display:none}

/* ---------- Presenter Mode Chrome ---------- */
#present-chrome{position:sticky;top:0;z-index:40;background:rgba(11,23,37,.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.p-bar{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;padding:10px 24px;flex-wrap:wrap;max-width:1680px;margin:auto}
.p-nav-grp,.p-tool-grp{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.p-btn{border:1px solid var(--line);background:#152a3e;color:var(--text);border-radius:999px;padding:7px 15px;font-size:17px;font-weight:700;display:inline-flex;align-items:center;gap:7px;transition:transform .12s,background .15s,border-color .15s;white-space:nowrap}
.p-btn:hover{background:#1d3852;border-color:#4b6c88}
.p-btn:active{transform:scale(.97)}
.p-btn[disabled]{opacity:.38;cursor:not-allowed;transform:none}
.p-btn.active{background:#f0f4ef;color:#12283b;border-color:#f0f4ef}
.p-btn.brand-surya.active{background:var(--surya-brown);color:#FFF9EE;border-color:var(--surya)}
.p-btn.brand-monster.active{background:var(--monster);color:#0e2234;border-color:var(--monster2)}
.p-btn.accent-reset{border-color:var(--surya);color:var(--surya);background:#efbd6c16}
.p-btn.accent-reset:hover{background:#efbd6c2a}
.p-btn.mode-btn{background:#1d3b52;border-color:#486985}
.p-step-pill{background:#1b3349;border:1px solid #456582;border-radius:999px;padding:6px 16px;font-size:18px;font-weight:800;color:var(--surya);display:inline-flex;align-items:center;gap:10px}
.p-dots{display:inline-flex;align-items:center;gap:6px;margin-left:2px}
.p-dot{width:10px;height:10px;border-radius:999px;border:none;padding:0;background:#355168;transition:all .18s}
.p-dot:hover{background:#6d8da7}
.p-dot.active{width:26px;background:var(--surya)}
.p-seg{display:inline-flex;background:#0e1d2c;border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.p-seg .p-btn{border:none;background:transparent;padding:6px 14px;font-size:18px}
.p-seg .p-btn:hover{background:#193046}
.p-select{font-size:18px;font-weight:700;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:#152a3e;color:var(--text)}
.p-tray{border-top:1px solid var(--line);background:#0f2032;padding:14px 24px}
.p-tray-in{max-width:1680px;margin:auto;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}
.p-tray-lbl{font-size:16px;color:var(--quiet);font-weight:700;margin-right:4px}
.p-tray-in label{font-size:16px;color:var(--muted);display:flex;align-items:center;gap:8px}
.p-tray-in input[type=date],.p-tray-in select{font-size:17px;padding:7px 12px;border-radius:10px}
.p-tray-in label.chk{font-size:18px;color:var(--text)}
.p-meta{background:#09131f;border-top:1px solid #22384b;padding:6px 24px;font-size:15px;color:#c2d0dc}
.p-meta-in{max-width:1680px;margin:auto;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between}
.p-meta-facts{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.p-draft{background:#efbd6c22;color:var(--surya);border:1px solid #efbd6c55;border-radius:6px;padding:1px 9px;font-weight:800;font-size:14px}
.p-stale{background:#f29e9e22;color:#ffd0d0;border:1px solid #f29e9e66;border-radius:6px;padding:1px 9px;font-weight:700;font-size:14px}
.p-kbd-hint{color:var(--quiet);font-size:14px}

/* ---------- Presenter Stage Readability (>=18px Rule) ---------- */
body.present-mode{font-size:18px;line-height:1.55}
body.present-mode .shell{width:min(1600px,calc(100% - 48px))}
body.present-mode main{padding:22px 0 44px}
.p-stage{display:flex;flex-direction:column;gap:18px;animation:fadeSlide .18s ease-out}
@keyframes fadeSlide{from{opacity:.55;transform:translateY(6px)}to{opacity:1;transform:none}}
.p-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;border-bottom:1px solid #284259;padding-bottom:14px}
.p-kicker{display:inline-flex;align-items:center;gap:8px;font-size:18px;font-weight:800;color:var(--surya);letter-spacing:.04em;margin:0 0 6px}
.p-head h2{font-size:clamp(2rem,3vw,2.85rem);line-height:1.15;letter-spacing:-.025em;margin:0;font-weight:900}
.p-sub{font-size:1.05rem;color:var(--muted);margin:6px 0 0}
.p-head-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Sub-tabs inside a stop (keeps screens focused & fun) */
.p-subtabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.p-subtab{border:1px solid var(--line);background:#122436;color:var(--muted);border-radius:999px;padding:9px 18px;font-size:18px;font-weight:700;transition:all .15s}
.p-subtab:hover{border-color:#5b7d99;color:var(--text)}
.p-subtab[aria-selected="true"]{background:#f0f4ef;color:#112334;border-color:#f0f4ef}
.SURYA-theme .p-subtab[aria-selected="true"]{background:var(--surya-brown);color:#FFF9EE;border-color:var(--surya)}
.Monster-theme .p-subtab[aria-selected="true"]{background:var(--monster);color:#0f2336;border-color:var(--monster2)}

/* Presenter Cards & Typography (>=18px everywhere important) */
body.present-mode .card,
body.present-mode .insight,
body.present-mode .pattern,
body.present-mode .post{border-radius:20px;padding:20px 22px}
body.present-mode .kind,
body.present-mode .badge,
body.present-mode .bn,
body.present-mode .rank{font-size:18px;line-height:1.3}
body.present-mode .kind{padding:4px 12px;border-radius:8px}
body.present-mode .badge{padding:4px 12px}
body.present-mode .badge i{width:10px;height:10px}
body.present-mode .insight p,
body.present-mode .exp p,
body.present-mode .pattern p,
body.present-mode .fine,
body.present-mode .caution,
body.present-mode .hint,
body.present-mode .unit,
body.present-mode .delta{font-size:18px;line-height:1.55}
body.present-mode .insight small{font-size:18px;color:var(--muted);margin-top:12px}
body.present-mode .kpi .big{font-size:clamp(2.35rem,3.3vw,3.1rem);margin-top:10px}
body.present-mode .barline{grid-template-columns:108px 1fr 90px;font-size:18px;gap:10px;margin-top:8px}
body.present-mode .track{height:12px}
body.present-mode .stats{padding-top:14px;margin-top:14px;gap:12px}
body.present-mode .stats span,
body.present-mode .stats b{font-size:18px}
body.present-mode .spark{height:68px;gap:6px;margin-top:16px}
body.present-mode .exp h3{font-size:1.25rem;margin:10px 0 8px}
body.present-mode .exp .measure{font-size:18px;padding-top:12px;margin-top:10px}
body.present-mode .post h4{font-size:1.08rem;line-height:1.45}
body.present-mode .thumb:not(.has){aspect-ratio:auto;min-height:48px;padding:8px 12px;font-size:15px}
body.present-mode .podium .pm{grid-template-columns:repeat(2,1fr);gap:8px 12px}
body.present-mode .pm span,
body.present-mode .pm b{font-size:18px}
body.present-mode .pm b{font-size:1.2rem}
body.present-mode .meta{font-size:18px;gap:8px 12px}
body.present-mode .post-ext{padding:3px 12px;border-radius:999px;background:#8fe1f01a;border:1px solid #8fe1f055;font-weight:700}
body.present-mode .legend{font-size:18px;gap:20px}
body.present-mode .legend i{width:14px;height:14px}
body.present-mode table{font-size:18px}
body.present-mode th,body.present-mode td{font-size:18px;padding:11px 14px}

/* Clickable Drill-Down Cards */
.drillable{cursor:pointer;position:relative;transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease}
.drillable:hover{transform:translateY(-2px);border-color:#6895b8;box-shadow:0 10px 26px rgba(0,0,0,.28)}
.drillable:focus-visible{outline:3px solid #65d9ec}
.drill-hint{display:inline-flex;align-items:center;gap:5px;color:var(--link);font-size:18px;font-weight:700;margin-top:8px}

/* Spotlight Executive Fact Card on Stop 1 */
.spotlight{background:linear-gradient(135deg,#1c384f,#12263a);border:1px solid #416582;border-radius:20px;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.spotlight-body{flex:1;min-width:0}
.spotlight-body p{margin:8px 0 0;font-size:1.15rem;line-height:1.5;color:#eef5f8}
.spotlight-nav{display:flex;align-items:center;gap:8px;flex-shrink:0}
.icon-circle{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#163047;color:var(--text);font-size:20px;display:grid;place-items:center}
.icon-circle:hover{background:#234766}

/* Interactive HTML Pillar Bars (Guaranteed >=18px at any viewport) */
.pillar-bars{display:flex;flex-direction:column;gap:10px}
.pbar-row{display:grid;grid-template-columns:130px 1fr 118px;align-items:center;gap:12px;background:#0e2031;border:1px solid #243f56;border-radius:12px;padding:10px 14px;text-align:left;color:var(--text);transition:border-color .15s,background .15s;width:100%}
.pbar-row:hover{border-color:var(--accent,var(--surya));background:#142b40}
.pbar-row.thin-row{opacity:.68}
.pbar-lbl{font-size:18px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbar-track{display:block;height:16px;background:#1e364a;border-radius:999px;overflow:hidden}
.pbar-fill{display:block;height:100%;border-radius:999px;background:var(--mark,var(--m-surya));transition:width .25s ease}
.pbar-val{font-size:18px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pbar-val span{color:var(--muted);font-weight:600}

/* Month Chips for Trends Drill-Down */
.month-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.m-chip{border:1px solid var(--line);background:#112538;color:var(--text);border-radius:999px;padding:6px 14px;font-size:18px;font-weight:700}
.m-chip:hover{border-color:var(--surya);color:var(--surya)}

/* Content Lab Metric Pills */
.metric-pills{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.m-pill{border:1px solid var(--line);background:#122537;color:var(--muted);border-radius:999px;padding:8px 16px;font-size:18px;font-weight:700}
.m-pill[aria-pressed="true"]{background:var(--surya);color:#122232;border-color:var(--surya)}
.lab-controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:#102336;border:1px solid var(--line);border-radius:18px;padding:14px 18px}
.lab-inputs{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lab-inputs select,.lab-inputs input{font-size:18px;padding:8px 14px;border-radius:12px}
.lab-inputs input[type=search]{min-width:320px}

/* Stop 7 Decision Board & Meeting Notes */
.dec-card{background:linear-gradient(155deg,#173046,#102234);border:1px solid var(--line);border-radius:20px;padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.dec-card.owner-hero{border:2px solid var(--surya);background:linear-gradient(145deg,#25333f,#122436)}
.dec-card[data-status="approved"]{border-color:#74d3b088}
.dec-card[data-status="revise"]{border-color:#fed34788}
.dec-card[data-status="skip"]{opacity:.72}
.dec-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.dec-statuses{display:flex;flex-wrap:wrap;gap:6px}
.st-btn{border:1px solid var(--line);background:#0f2031;color:var(--muted);border-radius:999px;padding:6px 14px;font-size:18px;font-weight:700}
.st-btn[aria-pressed="true"][data-st="pending"]{background:#294156;color:#fff;border-color:#6888a3}
.st-btn[aria-pressed="true"][data-st="approved"]{background:#74d3b0;color:#0b241b;border-color:#74d3b0}
.st-btn[aria-pressed="true"][data-st="revise"]{background:#fed347;color:#241c06;border-color:#fed347}
.st-btn[aria-pressed="true"][data-st="skip"]{background:#6b7d8d;color:#fff;border-color:#8fa3b5}
.note-box{width:100%;background:#0a1826;border:1px solid #35526b;border-radius:12px;color:var(--text);padding:10px 14px;font-size:18px}
.note-box:focus{border-color:var(--surya)}
.notes-bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:#0e1e2e;border:1px solid var(--line);border-radius:16px;padding:14px 18px}

/* ---------- Drill-Down Drawer & Stop Jumper Modal ---------- */
.drawer-backdrop{position:fixed;inset:0;background:rgba(4,10,18,.72);backdrop-filter:blur(6px);z-index:80;display:flex;justify-content:flex-end}
.drawer-backdrop[hidden]{display:none}
.drawer{width:min(880px,95vw);height:100%;background:#0d1c2c;border-left:1px solid #3c5b75;display:flex;flex-direction:column;box-shadow:-16px 0 48px rgba(0,0,0,.5)}
.drawer-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:18px 24px;border-bottom:1px solid var(--line);background:#102336}
.drawer-head h3{margin:4px 0 0;font-size:1.35rem}
.drawer-body{flex:1;overflow:auto;padding:20px 24px;display:flex;flex-direction:column;gap:16px}
.drawer-stats{display:flex;flex-wrap:wrap;gap:10px 18px;background:#132a3f;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:18px}
.modal-backdrop{position:fixed;inset:0;background:rgba(4,10,18,.78);backdrop-filter:blur(8px);z-index:90;display:grid;place-items:center;padding:20px}
.modal-backdrop[hidden]{display:none}
.modal{width:min(960px,96vw);max-height:90vh;overflow:auto;background:#102234;border:1px solid #42637f;border-radius:24px;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.55)}
.jumper-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:16px}
.j-card{background:#152c42;border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;color:var(--text);display:flex;flex-direction:column;gap:6px}
.j-card:hover{border-color:var(--surya);background:#1b3650}
.j-card.current{border:2px solid var(--surya);background:#22384c}
.j-num{font-size:18px;font-weight:900;color:var(--surya)}
.j-title{font-size:1.12rem;font-weight:800;line-height:1.35}
.j-src{font-size:16px;color:var(--muted)}
#toast{position:fixed;bottom:24px;right:24px;background:#f0f4ef;color:#112334;padding:10px 18px;border-radius:999px;font-size:18px;font-weight:800;z-index:120;box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}

/* Brand Spotlight 2-column layout */
.split-2{display:grid;grid-template-columns:1.05fr 1fr;gap:18px;align-items:start}

/* Print-only deck & notes */
#print-deck,#print-notes{display:none}

/* ---------- Responsive ---------- */
@media(max-width:1440px){
  .p-bar{padding:8px 16px;gap:8px 10px}
  .p-nav-grp,.p-tool-grp{gap:6px}
  .p-btn{padding:6px 11px;font-size:15px}
  .p-seg .p-btn{padding:5px 10px;font-size:15px}
  .p-select{font-size:15px;padding:6px 10px}
  .p-step-pill{font-size:16px;padding:5px 12px;gap:8px}
  .p-meta{padding:5px 16px}
  .p-kbd-hint{display:none}
}
@media(max-width:960px){.split-2{grid-template-columns:1fr}}
@media(max-width:1000px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:720px){
  .shell,body.present-mode .shell{width:calc(100% - 24px)}
  .masthead{flex-direction:column;align-items:flex-start}
  .grid3,.grid2{grid-template-columns:1fr}
  .section-head{flex-direction:column;align-items:flex-start}.section-head>p{text-align:left}
  .brand-nav{flex-direction:column;align-items:stretch}
  .filters input[type=search]{width:100%}.filters label,.scope label{flex:1 1 44%}.lab{padding:14px}.sticky{position:static}
  .lab-inputs input[type=search]{min-width:0;width:100%}
  .pm{grid-template-columns:repeat(2,1fr)}
  #present-chrome{position:static}
  .p-bar{padding:10px 12px}.p-meta{padding:6px 12px}.p-kbd-hint{display:none}
  .p-bar .p-btn,.p-step-pill{padding:5px 10px;font-size:14px}
  .p-bar .p-seg .p-btn,.p-bar .p-select{padding:4px 9px;font-size:14px}
  .p-dots{display:none}
  .pbar-row{grid-template-columns:92px 1fr 98px;gap:8px;padding:9px 10px}

function bindThumbFallbacks(rootSelector) {
  document.querySelectorAll(`${rootSelector} .thumb img`).forEach(img => {
    img.addEventListener('error', () => { img.parentElement.classList.remove('has'); img.parentElement.textContent = 'โหลดภาพปกไม่ได้'; }, {once: true});
  });
}

function renderStop1() {
  const execs = I.executive || [];

    <button class="p-subtab" role="tab" aria-selected="${activeTab === 'score'}" data-sub="1:score">📊 ตัวเลขเดือนนี้ (1–${cd} ${curLbl})</button>

function renderBrandSpotlight(targetBrand, stopNum) {
  const t = (I.brands || {})[targetBrand] || {};
  const worked = t.worked || [], under = t.underperformed || [], why = (t.why || []).map(w => ({...w, type: w.type === 'hypothesis' ? 'inference' : w.type}));
  const allItems = [...worked, ...under, ...why];
  const activeTab = ['worked', 'under', 'why'].includes(S.sub[stopNum]) ? S.sub[stopNum] : 'worked';
  const shown = activeTab === 'worked' ? worked : activeTab === 'under' ? under : activeTab === 'why' ? why : allItems;
  const accent = targetBrand === 'SURYA' ? 'var(--surya)' : 'var(--monster)';
  const themeCls = cls(targetBrand) + '-theme';

  let notice = '';
  if (S.brand !== 'Compare' && S.brand !== targetBrand) {
    const otherStop = targetBrand === 'SURYA' ? 4 : 3;
    notice = `<div class="banner" style="margin:0;border-color:var(--warn)">
      <strong>ตัวกรองแบรนด์ตอนนี้เลือก ${esc(short(S.brand))} อยู่</strong>
      <span>หน้านี้แสดงผลของ ${esc(short(targetBrand))}</span>
      <button class="p-btn" data-setbrand="${esc(targetBrand)}">สลับตัวกรองเป็น ${esc(short(targetBrand))}</button>
      <button class="p-btn" data-jump="${otherStop}">ไป Stop ${otherStop} (${esc(short(S.brand))}) →</button>
    </div>`;
  }

  const subtabs = `<div class="p-subtabs ${themeCls}" role="tablist">
    <button class="p-subtab" role="tab" aria-selected="${activeTab === 'worked'}" data-sub="${stopNum}:worked">✅ ได้ผลดี (${worked.length})</button>
    <button class="p-subtab" role="tab" aria-selected="${activeTab === 'under'}" data-sub="${stopNum}:under">⚠️ ยังต่ำ (${under.length})</button>
    <button class="p-subtab" role="tab" aria-selected="${activeTab === 'why'}" data-sub="${stopNum}:why">💡 สมมติฐาน (${why.length})</button>
  </div>`;

  const leftCol = `<div style="display:flex;flex-direction:column;gap:14px">
    ${subtabs}
    ${shown.map(i => `<article class="insight ${cls(targetBrand)}" style="--accent:${accent}"><span class="kind ${i.type}">${KIND[i.type]}</span><p>${esc(i.text)}</p></article>`).join('')}
  </div>`;

  // Right Zone: Pillar interactive HTML bar charts per active platform (via sel() + stat())
  const allPl = plats();
  const focusPl = allPl.includes(S.spotPlat) ? S.spotPlat : allPl[0];
  const plList = [focusPl];
  const plChips = allPl.length > 1 ? allPl.map(pl => `<button type="button" class="p-btn ${pl === focusPl ? 'active' : ''}" data-splat="${pl}" aria-pressed="${pl === focusPl}">${platLogo(pl, 15)}${pl}</button>`).join('') : '';
  const blocks = plList.map(pl => {
    const rows = sel({brand: targetBrand, platform: pl});
    const g = {}; rows.forEach(p => (g[p.pillar] ||= []).push(p));
    const items = Object.entries(g).map(([k, v]) => { const st = stat(v); return {k, label: plabel(targetBrand, k), v: st.reach, n: st.n, er: st.er}; }).filter(i => i.v != null).sort((a, b) => b.v - a.v);
    const max = Math.max(...items.map(i => i.v), 1);
    const ok = Object.entries(g).filter(([k, v]) => v.length >= 5 && k !== 'Other').map(([k, v]) => ({k, ...stat(v)})).filter(x => x.reach != null);
    let factLine = '';
    if (ok.length) {
      const r = [...ok].sort((x, y) => y.reach - x.reach)[0], e = [...ok].sort((x, y) => (y.er ?? -1) - (x.er ?? -1))[0];
      factLine = `<p class="fine" style="margin:6px 0 10px;color:var(--accent)"><b>FACT:</b> ${esc(r.k)} ${REACH(pl)} ค่ากลางสูงสุด ${n0(r.reach)} (n=${r.n})${e.k !== r.k ? ` · ${esc(e.k)} ER สูงสุด ${p2(e.er)} (n=${e.n})` : ` · ER สูงสุด ${p2(e.er)}`}</p>`;
    }
    return `<div class="card ${cls(targetBrand)} plat-${pl}">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
        ${badge(pl)}<span class="unit">${REACH(pl)} ค่ากลางต่อโพสต์ · กดแถบเพื่อดูโพสต์</span>
      </div>
      ${factLine}
      ${items.length ? `<div class="pillar-bars">${items.map(it => `
        <button type="button" class="pbar-row${it.n < 5 ? ' thin-row' : ''}" data-drill="pillar" data-brand="${esc(targetBrand)}" data-platform="${esc(pl)}" data-pillar="${esc(it.k)}" title="${esc(it.label)} · ER ค่ากลาง ${p2(it.er)}">
          <span class="pbar-lbl">${esc(it.k)}</span>
          <span class="pbar-track"><span class="pbar-fill" style="width:${Math.max(4, 100 * it.v / max)}%"></span></span>
          <span class="pbar-val">${n0(it.v)} <span>(n=${it.n})</span></span>
        </button>`).join('')}</div>` : '<div class="empty">ไม่มีข้อมูลในตัวกรองนี้</div>'}
    </div>`;
  }).join('');

  const rightCol = `<div style="display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <span class="unit">Pillar breakdown (n&lt;5 แสดงจาง · อ่านเป็นทิศทาง)</span>
      <div style="display:flex;gap:8px;flex-wrap:wrap">${plChips}</div>
      <button class="p-btn" data-drawer="brand-tables" data-brand="${esc(targetBrand)}">📋 ดูตารางละเอียด ${esc(short(targetBrand))}</button>
    </div>
    ${blocks}
  </div>`;

  return `${notice}<div class="split-2">${leftCol}${rightCol}</div>`;
}

function renderStop7() {
  const items = allDecisionItems().filter(it => S.brand === 'Compare' || it.brand === S.brand || it.brand === 'ทั้งสองแบรนด์');
  const activeTab = S.sub[7] || 'all';
  const decItems = items.filter(it => it.group === 'decision');
  const restItems = items.filter(it => it.group !== 'decision').filter(it => {
    if (activeTab === 'exps') return it.group === 'exp';
    if (activeTab === 'recs') return it.group === 'rec';
    if (activeTab === 'pending') return getNote(it.key).status === 'pending';
    return true;
  });

  const cardFor = (it, isHero = false) => {
    const cur = getNote(it.key);
    return `<article class="dec-card${isHero ? ' owner-hero' : ''}" data-key="${esc(it.key)}" data-status="${esc(cur.status)}">
      <div class="dec-top">
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <span class="kind ${it.type}">${KIND[it.type]}</span>
          <span class="badge">${esc(it.brand)}</span>
        </div>
        <div class="dec-statuses">
          ${Object.entries(STATUS_LABELS).map(([st, lbl]) => `<button type="button" class="st-btn" data-st="${st}" data-notekey="${esc(it.key)}" aria-pressed="${cur.status === st}">${lbl}</button>`).join('')}
        </div>
      </div>
      <h3 style="margin:2px 0;font-size:1.2rem">${esc(it.title)}</h3>
      <p style="margin:0;font-size:18px;color:#dbe6ec">${esc(it.text)}</p>
      <p class="fine" style="margin:0;color:var(--surya)">${esc(it.detail)}</p>
      <input type="text" class="note-box" data-noteinput="${esc(it.key)}" value="${esc(cur.note)}" placeholder="บันทึกมติ / ผู้รับผิดชอบ / กำหนดเวลา...">
    </article>`;
  };

  const approvedN = items.filter(it => getNote(it.key).status === 'approved').length;
  const savedTime = NOTES.updated_at ? `บันทึกล่าสุด ${dth(NOTES.updated_at.slice(0, 16))}` : 'ยังไม่มีการแก้ไข';

  const subtabs = `<div class="p-subtabs" role="tablist">
    <button class="p-subtab" role="tab" aria-selected="${activeTab === 'decision'}" data-sub="7:decision">🧭 ต้องตัดสินใจ (${decItems.length})</button>
    <button class="p-subtab" role="tab" aria-selected="${activeTab === 'all'}" data-sub="7:all">ทั้งหมด (${items.length - decItems.length})</button>
    <button class="p-subtab" role="tab" aria-selected="${activeTab === 'exps'}" data-sub="7:exps">🧪 การทดลอง (${items.filter(i => i.group === 'exp').length})</button>
    <button class="p-subtab" role="tab" aria-selected="${activeTab === 'recs'}" data-sub="7:recs">🎯 ข้อเสนอ (${items.filter(i => i.group === 'rec').length})</button>
    <button class="p-subtab" role="tab" aria-selected="${activeTab === 'pending'}" data-sub="7:pending">⏳ รอตัดสินใจ</button>
  </div>`;

  const storageBar = `<div class="notes-bar">
    <div style="font-size:18px">💾 บันทึกอัตโนมัติในเบราว์เซอร์เครื่องนี้ (<code>localStorage: cpi_v2_meeting_notes</code>) · อนุมัติแล้ว <b>${approvedN}/${items.length}</b> · <span id="notes-ts">${savedTime}</span></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button type="button" class="p-btn" id="copy-notes-btn">📋 คัดลอกสรุป (Markdown)</button>
      <button type="button" class="p-btn" id="export-notes-btn">⬇️ ดาวน์โหลด JSON</button>
      <button type="button" class="p-btn" id="print-notes-btn">🖨️ พิมพ์ / PDF</button>
      <button type="button" class="p-btn" id="clear-notes-btn">🗑️ ล้างบันทึก</button>
    </div>
  </div>`;

  if (activeTab === 'decision') return `${subtabs}${decItems.map(it => cardFor(it, true)).join('') || '<div class="card empty">ไม่มีรายการที่ต้องตัดสินใจ</div>'}${storageBar}`;
  const pg = pager(7, restItems.length);
  return `<div class="tabs-row">${subtabs}${pg.html}</div>
    <div class="grid2">${restItems.length ? restItems.slice(pg.start, pg.end).map(it => cardFor(it, false)).join('') : '<div class="card empty">ไม่มีรายการในมุมมองนี้</div>'}</div>
    <p class="fine" style="margin:0">💾 บันทึกอัตโนมัติในเบราว์เซอร์เครื่องนี้ · อนุมัติแล้ว <b>${approvedN}/${items.length}</b> · คัดลอก ดาวน์โหลด หรือพิมพ์บันทึกได้ที่แท็บ “ต้องตัดสินใจ”</p>`;
}

// ---------- Print Summary of Meeting Notes & Presenter Deck ----------
function renderPrintNotes() {
  const items = allDecisionItems();
  const hasAny = items.some(it => { const n = getNote(it.key); return n.status !== 'pending' || n.note.trim(); });
  if (!hasAny) return '';
  return `<section id="print-notes"><h2>บันทึกมติจากที่ประชุม (${dth(NOTES.updated_at ? NOTES.updated_at.slice(0, 16) : cutoff)})</h2>
    <div class="scroll"><table><tr><th class="l">ประเภท</th><th class="l">แบรนด์</th><th class="l">รายการ</th><th class="l">สถานะ</th><th class="l">บันทึกเพิ่มเติม</th></tr>
    ${items.map(it => { const n = getNote(it.key); return `<tr><td class="l">${KIND[it.type]}</td><td class="l">${esc(it.brand)}</td><td class="l wrap">${esc(it.title)}</td><td class="l">${STATUS_LABELS[n.status] || n.status}</td><td class="l wrap">${esc(n.note || '—')}</td></tr>`; }).join('')}

}

function buildPrintDeck() {
  const savedSub = {...S.sub};

  const execHtml = `<div class="print-stop"><h2>Stop 1 · สรุปประเด็นสำคัญ (Executive Readout)</h2><div class="grid2">${(I.executive || []).map(i => `<article class="insight"><span class="kind ${i.type}">${KIND[i.type]}</span><p>${esc(i.text)}</p>${i.source ? `<small>ที่มา: ${esc(i.source)}</small>` : ''}</article>`).join('')}</div></div>`;
  const stopsHtml = [
    `<div class="print-stop"><h2>Stop 1 · Scorecard (1–${cd} ${curLbl} เทียบ ${prevLbl})</h2><div class="grid3">${brands().flatMap(b => plats().map(pl => scorecardCardHTML(b, pl, false))).join('')}</div></div>` + execHtml,
    `<div class="print-stop">${audience()}</div><div class="print-stop">${trends()}</div>`,
    `<div class="print-stop"><h2>Stop 3 · ${STOPS[2].title}</h2>${renderBrandSpotlight('SURYA', 3)}</div>`,

    `<div class="print-stop"><h2>Stop 5 · ${STOPS[4].title}</h2>${renderStop5()}</div>`,
    `<div class="print-stop"><h2>Stop 6 · ${STOPS[5].title}</h2>${renderStop6()}</div>`,

// ---------- Drill-Down Drawer Controller ----------
function openDrawer({kicker, title, html, bind}) {
  $('#drawer-kicker').textContent = kicker;
  $('#drawer-title').textContent = title;
  $('#drawer-body').innerHTML = html;
  $('#drawer').hidden = false;
  $('#drawer-body').scrollTop = 0;
  bindThumbFallbacks('#drawer-body');
  if (bind) bind();
}
function closeDrawer() { $('#drawer').hidden = true; }

function openPostsDrawer({kicker, title, rows, metric = 'reach', periodSwitch = null}) {
  const s = stat(rows);
  const plSet = new Set(rows.map(r => r.platform));
  const plLabel = plSet.size === 1 ? REACH([...plSet][0]) : 'Reach / Views';
  const sorted = [...rows].sort((a, b) => metric === 'dt' ? b.dt.localeCompare(a.dt) : (b[metric] ?? -1) - (a[metric] ?? -1) || b.dt.localeCompare(a.dt));

  const switchBar = periodSwitch ? `<div class="p-subtabs">${periodSwitch.map(opt => `<button type="button" class="p-subtab" aria-selected="${opt.active}" data-dperiod="${opt.id}">${esc(opt.label)}</button>`).join('')}</div>` : '';

  const html = `${switchBar}
    <div class="drawer-stats">
      <span>โพสต์: <b>${s.n}</b></span>
      <span>${plLabel} ค่ากลาง: <b>${n0(s.reach)}</b></span>
      ${plSet.size === 1 ? `<span>ER ค่ากลาง: <b>${p2(s.er)}</b></span>` : '<span>ER: ไม่เทียบข้ามแพลตฟอร์ม</span>'}
      <span>Sum of post ${plLabel.toLowerCase()}: <b>${n0(s.sum)}</b></span>
      ${s.pending ? `<span class="caution" style="margin:0">รอซิงก์ ${s.pending} โพสต์</span>` : ''}
    </div>
    ${sorted.length ? sorted.map((p, i) => postCard(p, i, false, metric)).join('') : '<div class="empty">ไม่มีโพสต์ในช่วงตัวกรองนี้</div>'}`;

  openDrawer({
    kicker, title, html,
    bind: () => {
      document.querySelectorAll('#drawer-body [data-dperiod]').forEach(btn => {
        btn.onclick = () => {
          const opt = periodSwitch.find(o => o.id === btn.dataset.dperiod);
          if (opt) opt.open();
        };
      });
    }
  });
}

function openKpiDrawer(brand, platform, periodId = 'mtd') {
  const opts = [
    {id: 'mtd', label: `1–${cd} ${curLbl} (${stat(sel({brand, platform, ...mtd})).n})`, range: mtd},
    {id: 'prev', label: `1–${+prev.to.slice(8)} ${prevLbl} (${stat(sel({brand, platform, ...prev})).n})`, range: prev},
    {id: 'base', label: `${prevLbl} ทั้งเดือน (${stat(sel({brand, platform, ...base})).n})`, range: base}
  ];
  const active = opts.find(o => o.id === periodId) || opts[0];
  const rows = sel({brand, platform, ...active.range});
  openPostsDrawer({
    kicker: `DRILL-DOWN · ${short(brand).toUpperCase()} · ${platform.toUpperCase()}`,
    title: `${brand} · ${platform} (${active.label.split(' (')[0]})`,
    rows,
    periodSwitch: opts.map(o => ({id: o.id, label: o.label, active: o.id === active.id, open: () => openKpiDrawer(brand, platform, o.id)}))
  });
}

function openPillarDrawer(brand, platform, pillar) {
  const rows = sel({brand, platform}).filter(p => p.pillar === pillar);
  openPostsDrawer({
    kicker: `PILLAR DRILL-DOWN · ${short(brand).toUpperCase()} · ${platform.toUpperCase()}`,
    title: `${plabel(brand, pillar)} · ${dth(S.from)} – ${dth(S.to)}`,
    rows
  });
}

function openMonthDrawer(month) {
  const rows = sel({noDate: true}).filter(p => p.dt.startsWith(month));
  openPostsDrawer({
    kicker: `MONTHLY DRILL-DOWN · ${TH[+month.slice(5) - 1]} ${month.slice(0, 4)}`,
    title: `โพสต์เดือน ${TH[+month.slice(5) - 1]} ${month.slice(0, 4)} (${brands().map(short).join(' + ')} · ${S.platform})`,
    rows
  });
}

function openAllPostsDrawer() {
  const rows = labRows();
  openPostsDrawer({
    kicker: `CONTENT LAB · RANKED POSTS (${rows.length})`,
    title: `จัดอันดับตาม ${METRICS[S.metric]}`,
    rows: rows.slice(0, 80),
    metric: S.metric
  });
}

function openMethodDrawer() {
  openDrawer({
    kicker: '08 / METHOD, LIMITS & SOURCES',
    title: 'อ่านรีพอร์ตนี้อย่างไร · แหล่งข้อมูลและข้อจำกัด',
    html: method(false)
  });
}

  $('#present-meta').innerHTML = `<div class="p-meta-in">
    <div class="p-meta-facts">
      <span class="p-draft">${esc((I.status || 'DRAFT').split(' · ')[0])}</span>
      <span>Refresh ล่าสุด <b>${dth(M.generated_at)}</b></span>
      <span>Publer ล่าสุด <b>${dth(M.latest_source_as_of)}</b></span>
      <span>โพสต์ล่าสุด <b>${dth(M.latest_post)}</b></span>
      <span>Snapshot (ไม่ใช่ real-time)</span>
      ${staleChip}
    </div>
    <span class="p-kbd-hint">←/→/Space เปลี่ยนหน้า · 1–7 ข้ามหน้า · B แบรนด์ · T แพลตฟอร์ม · R รีเซ็ต</span>

function updateMoreHint() {
  let h = $('#more-hint');
  if (!h) { h = document.createElement('div'); h.id = 'more-hint'; h.textContent = '↓ มีเนื้อหาต่อด้านล่าง'; h.setAttribute('aria-hidden', 'true'); document.body.appendChild(h); }
  const de = document.documentElement;
  h.hidden = !(S.mode === 'present' && de.scrollHeight - innerHeight - scrollY > 24);
}
addEventListener('scroll', updateMoreHint, {passive: true});
addEventListener('resize', updateMoreHint);

function bindPresenterEvents() {
  const stageJump = $('#stage-jump-btn');
  if (stageJump) stageJump.onclick = () => openJumper();

  document.querySelectorAll('#main [data-sub]').forEach(btn => {
    btn.onclick = () => {
      const [stop, tab] = btn.dataset.sub.split(':');
      S.sub[stop] = tab; S.page[stop] = 0;
      renderPresenterStage();
    };
  });

  const exPrev = $('#ex-prev'), exNext = $('#ex-next');
  if (exPrev) exPrev.onclick = () => { S.execIdx = (S.execIdx - 1 + (I.executive || []).length) % (I.executive || []).length; renderPresenterStage(); };
  if (exNext) exNext.onclick = () => { S.execIdx = (S.execIdx + 1) % (I.executive || []).length; renderPresenterStage(); };

  document.querySelectorAll('#main [data-tplat]').forEach(btn => {
    btn.onclick = () => { S.trendPlat = btn.dataset.tplat; renderPresenterStage(); };
  });

  document.querySelectorAll('#main [data-splat]').forEach(btn => {
    btn.onclick = () => { S.spotPlat = btn.dataset.splat; renderPresenterStage(); };
  });
  document.querySelectorAll('#main [data-page]').forEach(btn => {
    btn.onclick = () => { const [stop, d] = btn.dataset.page.split(':'); S.page[stop] = (S.page[stop] || 0) + parseInt(d, 10); renderPresenterStage(); };
  });

  document.querySelectorAll('#main [data-setbrand]').forEach(btn => {
    btn.onclick = () => { S.brand = btn.dataset.setbrand; syncFilterInputs(); syncURL(); render(); };
  });

  document.querySelectorAll('#main [data-jump]').forEach(btn => {
    btn.onclick = () => goToStop(parseInt(btn.dataset.jump, 10));
  });

  document.querySelectorAll('#main [data-drill="kpi"]').forEach(el => {
    el.onclick = () => openKpiDrawer(el.dataset.brand, el.dataset.platform);
  });

  document.querySelectorAll('#main [data-drill="pillar"]').forEach(el => {
    el.onclick = () => openPillarDrawer(el.dataset.brand, el.dataset.platform, el.dataset.pillar);
  });

  document.querySelectorAll('#main [data-drill="month"], #main .month-hit').forEach(el => {
    el.onclick = () => openMonthDrawer(el.dataset.month);
  });

  document.querySelectorAll('#main [data-drawer="trends-table"]').forEach(el => {
    el.onclick = () => openDrawer({kicker: '06 / HISTORICAL TRENDS', title: 'ตารางรายเดือน (ค่ากลาง · จำนวนโพสต์)', html: trendsTableHTML()});
  });

  document.querySelectorAll('#main [data-drawer="brand-tables"]').forEach(el => {
    el.onclick = () => openDrawer({kicker: `05 / PATTERN TABLES · ${short(el.dataset.brand).toUpperCase()}`, title: `ตารางละเอียด ${el.dataset.brand}`, html: brandTablesHTML(el.dataset.brand)});
  });

  document.querySelectorAll('#main [data-drawer="all-posts"]').forEach(el => {
    el.onclick = () => openAllPostsDrawer();
  });

  // Stop 5 controls
  document.querySelectorAll('#main [data-metric]').forEach(btn => {
    btn.onclick = () => { S.metric = btn.dataset.metric; S.visible = 9; syncURL(); renderPresenterStage(); };
  });
  const pp = $('#p-pillar'), pq = $('#p-q');
  if (pp) pp.onchange = e => { S.pillar = e.target.value; S.visible = 9; syncURL(); renderPresenterStage(); };
  if (pq) pq.oninput = e => {
    const pos = e.target.selectionStart;
    S.q = e.target.value; S.visible = 9; syncURL(); renderPresenterStage();
    const inp = $('#p-q'); if (inp) { inp.focus(); inp.setSelectionRange(pos, pos); }
  };

  // Stop 7 meeting decision controls
  document.querySelectorAll('#main [data-notekey][data-st]').forEach(btn => {
    btn.onclick = () => {
      const k = btn.dataset.notekey, st = btn.dataset.st;
      setNoteStatus(k, st);
      renderPresenterStage();
    };
  });
  document.querySelectorAll('#main [data-noteinput]').forEach(inp => {
    inp.oninput = e => {
      setNoteText(inp.dataset.noteinput, e.target.value);
      const ts = $('#notes-ts');
      if (ts && NOTES.updated_at) ts.textContent = `บันทึกล่าสุด ${dth(NOTES.updated_at.slice(0, 16))}`;
    };
  });

  const copyBtn = $('#copy-notes-btn');
  if (copyBtn) copyBtn.onclick = async () => {
    const linesOut = ['# COFFLORER Meeting Decisions', `Snapshot: ${M.latest_source_as_of} | Latest post: ${M.latest_post}`, ''];
    for (const it of allDecisionItems()) {
      const n = getNote(it.key);
      linesOut.push(`- [${KIND[it.type]}] (${it.brand}) **${it.title}** — **${STATUS_LABELS[n.status]}**${n.note ? ` · หมายเหตุ: ${n.note}` : ''}`);
    }
    const text = linesOut.join('\n');
    try { await navigator.clipboard.writeText(text); showToast('คัดลอกสรุปการประชุมแล้ว'); }
    catch { prompt('คัดลอกสรุปการประชุมด้านล่าง:', text); }
  };

  const expBtn = $('#export-notes-btn');
  if (expBtn) expBtn.onclick = () => {
    const payload = {generated_at: new Date().toISOString(), snapshot: M.latest_source_as_of, items: allDecisionItems().map(it => ({...it, ...getNote(it.key)}))};
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type: 'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `cofflorer-decisions-${cutoff}.json`; a.click();
    showToast('ดาวน์โหลด JSON แล้ว');
  };

  const prBtn = $('#print-notes-btn');
  if (prBtn) prBtn.onclick = () => triggerPrint();

  const clrBtn = $('#clear-notes-btn');
  if (clrBtn) clrBtn.onclick = () => {
    if (!confirm('ล้างสถานะและบันทึกการประชุมทั้งหมดในเบราว์เซอร์นี้?')) return;
    NOTES = {updated_at: null, items: {}};
    try { localStorage.removeItem(NOTES_KEY); } catch {}
    renderPresenterStage();
    showToast('ล้างบันทึกแล้ว');
  };
}

function openJumper() {
  $('#jumper-grid').innerHTML = STOPS.map(st => `<button type="button" class="j-card${st.id === S.stop ? ' current' : ''}" data-jstop="${st.id}">
    <span class="j-num">STOP 0${st.id} / 0${STOPS.length}</span>
    <span class="j-title">${esc(st.title)}</span>
    <span class="j-src">${esc(st.src)}</span>
  </button>`).join('');
  $('#stop-jumper').hidden = false;
  document.querySelectorAll('#jumper-grid [data-jstop]').forEach(b => b.onclick = () => goToStop(parseInt(b.dataset.jstop, 10)));
}

function syncFilterInputs() {
  const pName = matchingPreset();
  $('#s-platform').value = S.platform;
  $('#s-format').value = S.format;
  $('#s-preset').value = pName;
  $('#s-from').value = S.from;
  $('#s-to').value = S.to;
  $('#s-recruit').checked = S.noRecruit;

  $('#p-from').value = S.from;
  $('#p-to').value = S.to;
  $('#p-format').value = S.format;
  $('#p-recruit').checked = S.noRecruit;
}

function resetFilters() {
  Object.assign(S, {
    brand: DEFAULT_S.brand,
    platform: DEFAULT_S.platform,
    from: DEFAULT_S.from,
    to: DEFAULT_S.to,
    format: DEFAULT_S.format,
    noRecruit: DEFAULT_S.noRecruit,
    pillar: DEFAULT_S.pillar,
    q: DEFAULT_S.q,
    metric: DEFAULT_S.metric,
    visible: DEFAULT_S.visible
  });
  syncFilterInputs();
  syncURL();
  render();
  showToast('รีเซ็ตตัวกรองเป็นค่าเริ่มต้นแล้ว');
}

function setMode(nextMode) {
  S.mode = nextMode;
  closeDrawer();
  $('#stop-jumper').hidden = true;
  $('#p-filter-tray').hidden = true;
  syncURL();
  render();
}

function triggerPrint() {
  if (S.mode === 'present') {
    const deck = $('#print-deck');
    if (deck) deck.innerHTML = buildPrintDeck();
  } else {
    document.querySelectorAll('details').forEach(d => d.open = true);
  }
  print();
}

// ---------- Main Render ----------
function render() {
  document.body.className = S.mode === 'present' ? 'present-mode' : 'analysis-mode';
  document.body.dataset.brandTheme = S.brand;
  $('#tabs').innerHTML = [['Compare', 'สองแบรนด์'], ['SURYA', 'Coffee Explorers'], ['Monster and Friends', 'and Friends']].map(([b, s]) => `<button class="tab" data-brand="${b}" aria-pressed="${S.brand === b}">${b === 'Monster and Friends' ? 'Monster' : b} <small>${s}</small></button>`).join('');

  if (S.mode === 'present') {
    renderPresenterChrome();
    renderPresenterStage();
  } else {
    $('#main').innerHTML = Object.entries(SECTIONS).map(([id, f]) => `<section id="${id}">${f()}</section>`).join('') + renderPrintNotes();
    $('#l-pillar').onchange = e => { S.pillar = e.target.value; S.visible = 9; syncURL(); renderLab(); };
    $('#l-metric').onchange = e => { S.metric = e.target.value; S.visible = 9; syncURL(); renderLab(); };
    $('#l-q').oninput = e => { S.q = e.target.value; S.visible = 9; syncURL(); renderLab(); };
    renderLab();
  }
}

// ---------- Keyboard Shortcuts ----------
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;

  if (e.key === 'Escape') {
    if (!$('#drawer').hidden) { closeDrawer(); return; }
    if (!$('#stop-jumper').hidden) { $('#stop-jumper').hidden = true; return; }
    if (!$('#p-filter-tray').hidden) { $('#p-filter-tray').hidden = true; $('#p-more-btn').setAttribute('aria-expanded', 'false'); $('#p-more-btn').classList.remove('active'); return; }
    return;
  }
  if (typing) return;

  if (e.key === 'p' || e.key === 'P') { e.preventDefault(); setMode(S.mode === 'present' ? 'analysis' : 'present'); return; }
  if (S.mode !== 'present') return;

  const drawerOpen = !$('#drawer').hidden;
  const jumperOpen = !$('#stop-jumper').hidden;
  if (!drawerOpen && !jumperOpen) {
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || (e.key === ' ' && tag !== 'button') || e.key === 'ArrowDown') {
      e.preventDefault(); if (S.stop < STOPS.length) goToStop(S.stop + 1); return;
    }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'ArrowUp') {
      e.preventDefault(); if (S.stop > 1) goToStop(S.stop - 1); return;
    }
  }
  if (/^[1-7]$/.test(e.key)) { e.preventDefault(); goToStop(parseInt(e.key, 10)); return; }
  if (e.key === 'g' || e.key === 'G') { e.preventDefault(); $('#stop-jumper').hidden ? openJumper() : ($('#stop-jumper').hidden = true); return; }
  if (e.key === 'b' || e.key === 'B') {
    e.preventDefault();
    const order = ['Compare', ...BR];
    S.brand = order[(order.indexOf(S.brand) + 1) % order.length];
    syncFilterInputs(); syncURL(); render(); return;
  }
  if (e.key === 't' || e.key === 'T') {
    e.preventDefault();
    const order = ['All', ...PL];
    S.platform = order[(order.indexOf(S.platform) + 1) % order.length];
    syncFilterInputs(); syncURL(); render(); return;
  }
  if (e.key === 'f' || e.key === 'F') {
    e.preventDefault();
    const tray = $('#p-filter-tray'); tray.hidden = !tray.hidden;
    $('#p-more-btn').setAttribute('aria-expanded', String(!tray.hidden));
    $('#p-more-btn').classList.toggle('active', !tray.hidden); return;
  }
  if (e.key === 'r' || e.key === 'R') { e.preventDefault(); resetFilters(); return; }
  if (e.key === 'm' || e.key === 'M') { e.preventDefault(); $('#drawer').hidden ? openMethodDrawer() : closeDrawer(); return; }
});

// ---------- Initialization ----------
function init() {
  readURL();
  $('#h-period').textContent = `${EN[cm - 1]} ${cy} MTD`;
  document.title = `Creative Performance Intelligence · ${EN[cm - 1]} ${cy} MTD | COFFLORER`;
  $('#h-snap').textContent = `PUBLER SNAPSHOT · ${dth(M.latest_source_as_of)}`;
  $('#banner').innerHTML = `<strong>${esc(I.status || 'DRAFT')}</strong><span>Refresh ล่าสุด <b>${dth(M.generated_at)}</b></span><span>อ่านค่าจาก Publer ล่าสุด <b>${dth(M.latest_source_as_of)}</b></span><span>โพสต์ล่าสุดในข้อมูล <b>${dth(M.latest_post)}</b></span><span><b>${M.posts.toLocaleString()}</b> โพสต์ไม่ซ้ำ · ${M.timezone}</span><span>เป็น snapshot ไม่ใช่ real-time · เดือนยังไม่ปิด</span>`;
  if (I.written_for_as_of && I.written_for_as_of < M.latest_source_as_of) {
    $('#stale').hidden = false;
    $('#stale').innerHTML = `<strong>ข้อมูลใหม่กว่าบทวิเคราะห์</strong><span>ข้อความสรุปเขียนจากข้อมูล ณ ${dth(I.written_for_as_of)} ตัวเลขในการ์ดและตารางเป็นปัจจุบันกว่า</span>`;
  }
  $('#foot').textContent = `COFFLORER · Creative Performance Intelligence · ร่างสำหรับตรวจภายใน · ข้อมูล Publer ณ ${dth(M.latest_source_as_of)} · จำนวนโพสต์นับรายแพลตฟอร์ม ไม่ใช่จำนวนชิ้นงานไม่ซ้ำ`;

  const fill = (el, list, v) => el.innerHTML = list.map(x => `<option${x === v ? ' selected' : ''}>${esc(x)}</option>`).join('');
  fill($('#s-platform'), ['All', ...PL], S.platform);
  fill($('#s-format'), FORMATS, S.format);
  fill($('#p-format'), FORMATS, S.format);
  fill($('#s-preset'), Object.keys(PRESETS), matchingPreset());

  const applyUpdate = () => { S.visible = 9; syncFilterInputs(); syncURL(); render(); };

  for (const k of ['from', 'to']) {
    for (const prefix of ['#s-', '#p-']) {
      const el = $(prefix + k);
      el.min = firstDay; el.max = cutoff; el.value = S[k];
      el.onchange = () => { if (el.value) { S[k] = el.value; applyUpdate(); } };
    }
  }
  $('#s-preset').onchange = e => { const r = PRESETS[e.target.value]; if (r) { [S.from, S.to] = r; applyUpdate(); } };
  $('#p-preset').onchange = e => { const r = PRESETS[e.target.value]; if (r) { [S.from, S.to] = r; applyUpdate(); } else { $('#p-filter-tray').hidden = false; } };
  $('#s-platform').onchange = e => { S.platform = e.target.value; applyUpdate(); };
  $('#s-format').onchange = e => { S.format = e.target.value; applyUpdate(); };
  $('#p-format').onchange = e => { S.format = e.target.value; applyUpdate(); };
  $('#s-recruit').onchange = e => { S.noRecruit = e.target.checked; applyUpdate(); };
  $('#p-recruit').onchange = e => { S.noRecruit = e.target.checked; applyUpdate(); };
  $('#tabs').onclick = e => { const b = e.target.closest('button'); if (b) { S.brand = b.dataset.brand; applyUpdate(); } };

  // Presenter top bar bindings
  $('#p-prev').onclick = () => { if (S.stop > 1) goToStop(S.stop - 1); };
  $('#p-next').onclick = () => { if (S.stop < STOPS.length) goToStop(S.stop + 1); };
  $('#p-where').onclick = e => {
    const dot = e.target.closest('[data-dot]');
    if (dot) { goToStop(parseInt(dot.dataset.dot, 10)); return; }
    $('#stop-jumper').hidden ? openJumper() : ($('#stop-jumper').hidden = true);
  };
  $('#p-brands').onclick = e => { const b = e.target.closest('[data-pbrand]'); if (b) { S.brand = b.dataset.pbrand; applyUpdate(); } };
  $('#p-plats').onclick = e => { const b = e.target.closest('[data-pplat]'); if (b) { S.platform = b.dataset.pplat; applyUpdate(); } };
  $('#p-more-btn').onclick = () => {
    const tray = $('#p-filter-tray'); tray.hidden = !tray.hidden;
    $('#p-more-btn').setAttribute('aria-expanded', String(!tray.hidden));
    $('#p-more-btn').classList.toggle('active', !tray.hidden);
  };
  $('#p-reset').onclick = resetFilters;
  $('#p-tray-reset').onclick = resetFilters;
  $('#p-method-btn').onclick = () => $('#drawer').hidden ? openMethodDrawer() : closeDrawer();
  $('#p-fs-btn').onclick = () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
    else document.exitFullscreen?.().catch(() => {});
  };
  document.addEventListener('fullscreenchange', () => {
    $('#p-fs-btn').textContent = document.fullscreenElement ? '✕ ออกเต็มจอ' : '⛶ เต็มจอ';
  });

  $('#toAnalysisBtn').onclick = () => setMode('analysis');
  $('#toPresentBtn').onclick = () => setMode('present');
  $('#printBtn').onclick = () => triggerPrint();
  window.addEventListener('beforeprint', () => {
    if (S.mode === 'present') {
      const deck = $('#print-deck');
      if (deck) deck.innerHTML = buildPrintDeck();
    } else {
      document.querySelectorAll('details').forEach(d => d.open = true);
    }
  });

  $('#drawer-close').onclick = closeDrawer;
  $('#drawer').onclick = e => { if (e.target === $('#drawer')) closeDrawer(); };
  $('#jumper-close').onclick = () => $('#stop-jumper').hidden = true;
  $('#stop-jumper').onclick = e => { if (e.target === $('#stop-jumper')) $('#stop-jumper').hidden = true; };

  document.addEventListener('mousemove', e => {
    const t = e.target.closest?.('[data-tip]'), tip = $('#tip');
    if (!t) { tip.style.display = 'none'; return; }
    tip.innerHTML = t.dataset.tip; tip.style.display = 'block';
    tip.style.left = Math.min(e.clientX + 12, innerWidth - 290) + 'px';
    tip.style.top = Math.min(e.clientY + 14, innerHeight - 80) + 'px';
  });

  syncFilterInputs();
  syncURL();
  render();
}
init();
</script>
</body>
</html>
