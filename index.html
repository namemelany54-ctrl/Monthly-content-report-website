/* ========== DESIGN TOKENS ========== */
:root{
  --font:"Noto Sans Thai","Leelawadee UI",Tahoma,Arial,sans-serif;
  --radius:6px;
  --radius-sm:4px;
  --bg:#f6f3ed;
  --surface:#ffffff;
  --surface-2:#efebe3;
  --line:#dcd4c6;
  --line-strong:#bfb4a0;
  --text:#1b1917;
  --muted:#524d46;
  --quiet:#787168;
  --surya:#76431C;
  --surya-ink:#76431C;
  --surya-soft:rgba(118,67,28,.08);
  --surya-gold:#9a7426;
  --monster:#385397;
  --monster-ink:#385397;
  --monster-soft:rgba(56,83,151,.08);
  --monster-gold:#c99700;
  --prev:#8f887d;
  --ig:#c2410c;
  --fb:#1d4ed8;
  --tt:#6d28d9;
  --up:#15623d;
  --down:#9f2323;
  --warn:#8a5300;
  --link:#1d4ed8;
  --focus:#1d4ed8;
  --chrome-bg:rgba(246,243,237,.97);
}
body.present-mode{
  color-scheme:dark;
  --bg:#0c1724;
  --surface:#122133;
  --surface-2:#182b42;
  --line:#273c54;
  --line-strong:#3a5675;
  --text:#f3f5f7;
  --muted:#b8c4d0;
  --quiet:#8798a9;
  --surya:#c9864c;
  --surya-ink:#e0a56e;
  --surya-soft:rgba(118,67,28,.22);
  --surya-gold:#dac259;
  --monster:#7ea4f5;
  --monster-ink:#9bb9fa;
  --monster-soft:rgba(56,83,151,.24);
  --monster-gold:#fed347;
  --prev:#6e8396;
  --ig:#f97316;
  --fb:#60a5fa;
  --tt:#a78bfa;
  --up:#6ee7b7;
  --down:#fca5a5;
  --warn:#fcd34d;
  --link:#93c5fd;
  --focus:#93c5fd;
  --chrome-bg:rgba(12,23,36,.97);
}

/* ========== BASE & ACCESSIBILITY ========== */
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:120px}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition-duration:.001ms!important;animation-duration:.001ms!important}
}

:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.shell{width:min(1320px,calc(100% - 48px));margin:auto;min-width:0;max-width:100%}
#main,section{min-width:0;max-width:100%}
.ico{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;line-height:0}
.bmark{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;line-height:0}
.bn-wrap{display:inline-flex;align-items:center;gap:6px}
.bn{font-size:.75rem;letter-spacing:.06em;font-weight:800;color:var(--accent)}
.SURYA{--accent:var(--surya-ink);--mark:var(--surya)}
.Monster{--accent:var(--monster-ink);--mark:var(--monster)}

/* ========== TYPOGRAPHY & EDITORIAL HIERARCHY ========== */
.eyebrow{color:var(--quiet);font-size:.74rem;font-weight:700;letter-spacing:.1em;margin:0;text-transform:uppercase}
h1,h2,h3,h4{margin:0;letter-spacing:-.02em;color:var(--text)}
h1{font-size:clamp(2rem,3.8vw,3.1rem);line-height:1.12;font-weight:800}
h1 em{color:var(--surya-ink);font-style:normal}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:14px;border-bottom:2px solid var(--text);margin-bottom:20px}
.sec-head h2{font-size:clamp(1.45rem,2.4vw,1.95rem);line-height:1.2;font-weight:800;margin-top:4px}
.sec-sub{color:var(--muted);font-size:.9rem;max-width:68ch;margin:4px 0 0}
.scope-pill{font-size:.75rem;font-weight:600;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:4px 10px;white-space:nowrap}
section{padding:36px 0;border-bottom:1px solid var(--line)}
section:last-of-type{border-bottom:none}
.fine{font-size:.82rem;color:var(--quiet);margin:10px 0 0}
.caution{color:var(--warn);font-size:.82rem;margin:6px 0 0;font-weight:600}

/* ========== MODE VISIBILITY ========== */
body.present-mode #analysis-chrome,
body.present-mode #foot{display:none}
body.analysis-mode #present-chrome{display:none}

/* ========== ANALYSIS MODE CHROME ========== */
.masthead{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding:28px 0 18px;border-bottom:1px solid var(--line)}
.subhead{color:var(--muted);margin:6px 0 0;font-size:.92rem}
.head-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.snap-tag{font-size:.78rem;font-weight:600;color:var(--muted);border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);padding:6px 11px;white-space:nowrap}
.btn{
  border:1px solid var(--line-strong);
  background:var(--surface);
  color:var(--text);
  border-radius:var(--radius);
  padding:7px 13px;
  font-size:.84rem;
  font-weight:600;
  display:inline-flex;
  align-items:center;
  gap:7px;
  white-space:nowrap;
  transition:background .15s,border-color .15s;
}
.btn:hover{background:var(--surface-2);border-color:var(--text)}
.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn.primary:hover{opacity:.9}
.btn[disabled]{opacity:.4;cursor:not-allowed}

.status-strip{
  display:flex;
  flex-wrap:wrap;
  gap:8px 18px;
  align-items:center;
  padding:10px 0;
  font-size:.82rem;
  color:var(--muted);
  border-bottom:1px solid var(--line);
}
.status-strip strong{color:var(--warn);font-weight:800;letter-spacing:.04em}
.status-strip b{color:var(--text)}
.status-strip.stale strong{color:var(--down)}

.sticky{position:sticky;top:0;z-index:20;background:var(--chrome-bg);border-bottom:1px solid var(--line)}
.brand-nav{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between;padding:10px 0}
.tabs{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--surface);padding:3px;gap:2px}
.tab{border:none;border-radius:var(--radius-sm);background:transparent;color:var(--muted);text-align:left;font-weight:700;font-size:.84rem;padding:5px 12px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.tab small{font-weight:500;color:var(--quiet);font-size:.76rem}
.tab[aria-pressed=true]{background:var(--text);color:var(--bg)}
.tab[aria-pressed=true] small{color:inherit;opacity:.8}
.tab[data-brand="SURYA"][aria-pressed=true]{background:#76431C;color:#FFF9EE}
.tab[data-brand^="Monster"][aria-pressed=true]{background:#385397;color:#FFF7D6}
.scope{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:end}
.scope label,.filters label{font-size:.74rem;color:var(--quiet);display:flex;flex-direction:column;gap:3px;font-weight:600}
.scope label.chk{flex-direction:row;align-items:center;gap:6px;font-size:.82rem;color:var(--muted);padding-bottom:6px;font-weight:500}
.chk input{accent-color:var(--surya);width:16px;height:16px}
select,input[type=date],input[type=search],.note-box{
  background:var(--surface);
  border:1px solid var(--line-strong);
  color:var(--text);
  border-radius:var(--radius-sm);
  padding:6px 10px;
  font-size:.84rem;
}
.jump{display:flex;gap:18px;overflow:auto;padding:4px 0 10px;white-space:nowrap;font-size:.8rem;border-top:1px solid var(--line)}
.jump a{color:var(--muted);font-weight:600;padding:4px 0}
.jump a:hover{color:var(--text);text-decoration:none;border-bottom:2px solid var(--text)}

/* ========== BADGES, TAGS & PLATFORM ACCENTS ========== */
.kind{font-size:.7rem;font-weight:800;letter-spacing:.05em;padding:2px 8px;border-radius:var(--radius-sm);display:inline-block;text-transform:uppercase;border:1px solid var(--line)}
.kind.verified{background:var(--surface-2);color:var(--text);border-color:var(--line-strong)}
.kind.hypothesis{background:rgba(154,116,38,.12);color:var(--warn);border-color:rgba(154,116,38,.3)}
.kind.inference{background:rgba(56,83,151,.1);color:var(--monster-ink);border-color:rgba(56,83,151,.28)}
.kind.experiment,.kind.decision{background:rgba(118,67,28,.1);color:var(--surya-ink);border-color:rgba(118,67,28,.3)}
.kind.agree{background:rgba(21,98,61,.1);color:var(--up);border-color:rgba(21,98,61,.28)}
.kind.partial,.kind.medium{background:rgba(154,116,38,.12);color:var(--warn);border-color:rgba(154,116,38,.3)}
.kind.disagree,.kind.high{background:rgba(159,35,35,.1);color:var(--down);border-color:rgba(159,35,35,.28)}
.kind.low{background:var(--surface-2);color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:600;border:1px solid var(--line);border-radius:var(--radius-sm);padding:2px 8px;color:var(--muted);background:var(--surface);white-space:nowrap}
.plat-tag{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.plat-Instagram{--plat-color:var(--ig)}
.plat-Facebook{--plat-color:var(--fb)}
.plat-TikTok{--plat-color:var(--tt)}

/* ========== EDITORIAL SURFACES & GRIDS ========== */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.card.plat-Instagram,.card.plat-Facebook,.card.plat-TikTok{border-left:3px solid var(--plat-color)}
.card.SURYA{border-top:2px solid var(--surya)}
.card.Monster{border-top:2px solid var(--monster)}

/* Executive Readout */
.lead-panel{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--surya);border-radius:var(--radius);padding:22px 24px}
.lead-headline{font-size:clamp(1.2rem,2vw,1.5rem);line-height:1.45;font-weight:700;margin:10px 0 8px}
.lead-src{font-size:.8rem;color:var(--quiet)}
.supporting-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:16px}
.supporting-item{padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.supporting-item p{margin:8px 0 6px;font-size:.92rem;line-height:1.55}
.supporting-item small{font-size:.76rem;color:var(--quiet)}

/* Tables & Scorecard */
.scroll{width:100%;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--quiet);font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:var(--surface-2)}
td.l,th.l{text-align:left}
td.wrap{white-space:normal;min-width:210px;text-align:left;line-height:1.5}
tr:last-child td{border-bottom:none}
tbody tr.drill-row{cursor:pointer;transition:background .12s}
tbody tr.drill-row:hover{background:var(--surface-2)}
.delta{font-size:.78rem;font-weight:700;padding:2px 6px;border-radius:var(--radius-sm);background:var(--surface-2);display:inline-block}
.delta.up{color:var(--up)}
.delta.down{color:var(--down)}

/* Audience Small Multiples */
.kpi-mini header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.kpi-mini .big{font-size:1.75rem;font-weight:800;line-height:1.15;letter-spacing:-.02em}
.kpi-mini .unit{font-size:.8rem;color:var(--muted);margin-top:2px}
.spark{display:flex;align-items:flex-end;gap:4px;height:40px;margin-top:12px}
.spark i{flex:1;background:var(--mark,var(--surya));border-radius:2px 2px 0 0;min-height:4px;opacity:.88}

/* Content Lab */
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-bottom:14px}
.filters input[type=search]{min-width:260px;flex:1;max-width:360px}
.hint{font-size:.82rem;color:var(--muted);margin:0 0 14px}
.plat-group{margin-top:24px}
.plat-group:first-child{margin-top:0}
.plat-group-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:8px;border-bottom:1px solid var(--line-strong);margin-bottom:14px}
.plat-group-head h3{font-size:1.05rem;font-weight:800;display:flex;align-items:center;gap:8px}
.podium-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.post-hero{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--plat-color,var(--line-strong));border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px}
.thumb{aspect-ratio:16/10;border-radius:var(--radius-sm);background:var(--surface-2);border:1px solid var(--line);overflow:hidden;display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:contain}
.thumb-missing{padding:10px 12px;background:var(--surface-2);border:1px dashed var(--line-strong);border-radius:var(--radius-sm);font-size:.78rem;color:var(--quiet);display:flex;justify-content:space-between;align-items:center;gap:8px}
.post-rank{font-size:.76rem;font-weight:800;letter-spacing:.05em;color:var(--quiet);display:flex;justify-content:space-between;align-items:center}
.post-hero h4{font-size:.98rem;line-height:1.45;font-weight:700;overflow-wrap:anywhere}
.primary-stat{display:flex;align-items:baseline;gap:8px;padding:8px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.primary-stat b{font-size:1.45rem;font-weight:800;line-height:1}
.primary-stat span{font-size:.78rem;color:var(--muted)}
.sub-metrics{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.sub-metrics b{color:var(--text)}
.meta-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.76rem;color:var(--quiet)}
.post-ext{font-weight:700;color:var(--link);display:inline-flex;align-items:center;gap:4px}

/* Ranked List Rows (Remaining posts) */
.ranked-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);margin-top:14px}
.ranked-row{display:grid;grid-template-columns:44px 72px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);border-left:3px solid var(--plat-color,transparent)}
.ranked-row:last-child{border-bottom:none}
.ranked-num{font-weight:800;font-size:.88rem;color:var(--quiet);text-align:center}
.ranked-thumb{width:72px;height:52px;border-radius:var(--radius-sm);background:var(--surface-2);border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;font-size:.7rem;color:var(--quiet);text-align:center;padding:2px}
.ranked-thumb img{width:100%;height:100%;object-fit:contain}
.ranked-main h4{font-size:.92rem;font-weight:700;line-height:1.4;margin:0 0 4px;overflow-wrap:anywhere}
.ranked-metrics{text-align:right;white-space:nowrap}
.ranked-metrics b{font-size:1.05rem;display:block}
.ranked-metrics span{font-size:.76rem;color:var(--muted)}
.more{text-align:center;padding:16px 0 4px}

/* Pattern Diagnostics & Charts */
.pbar-list{display:grid;gap:7px;margin-top:10px}
.pbar-row{
  display:grid;
  grid-template-columns:minmax(100px,130px) 1fr auto;
  align-items:center;
  gap:10px;
  padding:6px 8px;
  border-radius:var(--radius-sm);
  border:1px solid transparent;
  background:transparent;
  color:inherit;
  width:100%;
  text-align:left;
  transition:background .12s,border-color .12s;
}
.pbar-row:hover{background:var(--surface-2);border-color:var(--line)}
.pbar-lbl{font-size:.84rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar-track{height:10px;border-radius:3px;background:var(--surface-2);overflow:hidden;display:block}
.pbar-fill{display:block;height:100%;border-radius:3px;background:var(--mark,var(--surya))}
.pbar-val{font-size:.82rem;font-weight:700;white-space:nowrap}
.pbar-val small{font-weight:500;color:var(--quiet)}
.thin-row{opacity:.62}
.legend{display:flex;gap:18px;font-size:.82rem;color:var(--muted);margin:0 0 14px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:12px;height:12px;border-radius:2px;display:inline-block}
.chart svg text{fill:var(--quiet);font-size:11px;font-family:var(--font);font-variant-numeric:tabular-nums}
.chart svg .val-lbl{fill:var(--text);font-weight:700;font-size:11px}

/* Creative Briefs (Recommendations & Experiments) */
.brief-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:10px}
.brief-card.SURYA{border-top:2px solid var(--surya)}
.brief-card.Monster{border-top:2px solid var(--monster)}
.brief-card h3{font-size:1.05rem;line-height:1.4;font-weight:800}
.brief-grid{display:grid;gap:8px;margin-top:2px;padding-top:10px;border-top:1px solid var(--line);font-size:.86rem}
.brief-row{display:grid;grid-template-columns:110px 1fr;gap:10px}
.brief-row dt{font-weight:700;color:var(--quiet);font-size:.78rem}
.brief-row dd{margin:0;color:var(--text);line-height:1.5}

/* Expandables & Footer */
details{border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin-top:16px;background:var(--surface)}
summary{cursor:pointer;font-weight:700;font-size:.88rem;color:var(--text)}
footer{margin:40px 0 36px;color:var(--quiet);font-size:.8rem;border-top:1px solid var(--line);padding-top:16px}
.empty{padding:28px;text-align:center;color:var(--quiet);background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--radius)}

/* ========== PRESENTER MODE CHROME & STAGE ========== */
#present-chrome{position:sticky;top:0;z-index:40;background:var(--chrome-bg);border-bottom:1px solid var(--line)}
.p-bar{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;padding:10px 24px;flex-wrap:wrap;max-width:1400px;margin:auto}
.p-nav-grp,.p-tool-grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.p-btn{
  border:1px solid var(--line-strong);
  background:var(--surface);
  color:var(--text);
  border-radius:var(--radius);
  padding:7px 14px;
  font-size:16px;
  font-weight:600;
  display:inline-flex;
  align-items:center;
  gap:7px;
  white-space:nowrap;
  transition:background .12s,border-color .12s;
}
.p-btn:hover{background:var(--surface-2);border-color:var(--muted)}
.p-btn[disabled]{opacity:.38;cursor:not-allowed}
.p-btn.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.p-btn.brand-surya.active{background:#76431C;color:#FFF9EE;border-color:var(--surya)}
.p-btn.brand-monster.active{background:#385397;color:#FFF7D6;border-color:var(--monster-gold)}
.p-btn.accent-reset{border-color:var(--surya);color:var(--surya-ink)}
.p-step-pill{
  background:var(--surface);
  border:1px solid var(--line-strong);
  border-radius:var(--radius);
  padding:6px 14px;
  font-size:17px;
  font-weight:800;
  color:var(--surya-ink);
  display:inline-flex;
  align-items:center;
  gap:10px;
}
.p-dots{display:inline-flex;align-items:center;gap:5px}
.p-dot{width:8px;height:8px;border-radius:2px;border:none;padding:0;background:var(--line-strong)}
.p-dot.active{width:22px;background:var(--surya)}
.p-seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:3px;gap:3px}
.p-seg .p-btn{border:none;background:transparent;padding:5px 12px;font-size:16px}
.p-tray{border-top:1px solid var(--line);background:var(--surface);padding:12px 24px}
.p-tray-in{max-width:1400px;margin:auto;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.p-tray-in label{font-size:15px;color:var(--muted);display:flex;align-items:center;gap:7px}
.p-meta{max-width:1400px;margin:auto;padding:6px 24px 8px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between;font-size:14px;color:var(--quiet);border-top:1px solid var(--line)}
.p-meta-left{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.p-draft{color:var(--warn);font-weight:800;border:1px solid rgba(252,211,77,.35);padding:1px 8px;border-radius:var(--radius-sm);font-size:13px}
.p-keys{font-size:13px;color:var(--quiet)}

/* Presenter Stage (>=18px primary reading size) */
body.present-mode main{padding:20px 0 36px}
.p-stage{display:grid;gap:18px}
.p-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:14px;border-bottom:2px solid var(--line-strong)}
.p-kicker{font-size:16px;font-weight:800;color:var(--surya-ink);letter-spacing:.05em;margin:0 0 4px}
.p-head h2{font-size:clamp(1.75rem,3vw,2.45rem);line-height:1.18;font-weight:800}
.p-sub{font-size:18px;color:var(--muted);margin:6px 0 0}
.p-brand-hero{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.p-brand-tag{font-size:14px;font-weight:800;letter-spacing:.05em;padding:3px 11px;border-radius:var(--radius-sm);display:inline-flex;align-items:center;gap:6px}
.p-brand-tag.SURYA{background:#76431C;color:#FFF9EE;border:1px solid #c9864c}
.p-brand-tag.Monster{background:#385397;color:#FFF7D6;border:1px solid #fed347}

.p-subtabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.p-subtab{border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);border-radius:var(--radius);padding:8px 16px;font-size:18px;font-weight:700;display:inline-flex;align-items:center;gap:7px}
.p-subtab:hover{color:var(--text);border-color:var(--muted)}
.p-subtab[aria-selected="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.SURYA-theme .p-subtab[aria-selected="true"]{background:#76431C;color:#FFF9EE;border-color:var(--surya)}
.Monster-theme .p-subtab[aria-selected="true"]{background:#385397;color:#FFF7D6;border-color:var(--monster-gold)}

body.present-mode .lead-headline{font-size:clamp(1.35rem,2.1vw,1.7rem)}
body.present-mode .supporting-item p,
body.present-mode .brief-row dd,
body.present-mode .pbar-lbl,
body.present-mode .pbar-val,
body.present-mode .post-hero h4,
body.present-mode .ranked-main h4,
body.present-mode table,
body.present-mode th,
body.present-mode td{font-size:18px}
body.present-mode .sec-sub,
body.present-mode .p-sub,
body.present-mode .hint{font-size:18px}
body.present-mode .kpi-mini .big{font-size:2.1rem}
body.present-mode .kpi-mini .unit{font-size:16px}
body.present-mode .badge{font-size:15px}
body.present-mode .fine{font-size:16px}
body.present-mode .podium-grid .thumb{max-height:240px}

.tabs-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.pager{display:flex;align-items:center;gap:8px}
.icon-circle{width:38px;height:38px;border-radius:var(--radius);border:1px solid var(--line-strong);background:var(--surface);color:var(--text);font-size:20px;font-weight:800;display:inline-grid;place-items:center}
.icon-circle:hover{background:var(--surface-2)}
.icon-circle[disabled]{opacity:.35;cursor:not-allowed}

.split-2{display:grid;grid-template-columns:1.05fr 1fr;gap:18px;align-items:start}
.spotlight{display:flex;justify-content:space-between;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line-strong);border-left:4px solid var(--surya);border-radius:var(--radius);padding:16px 20px}
.spotlight p{margin:8px 0 0;font-size:18px;line-height:1.5}

.lab-controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px}
.metric-pills{display:flex;flex-wrap:wrap;gap:6px}
.m-pill{border:1px solid var(--line-strong);background:var(--surface-2);color:var(--muted);border-radius:var(--radius);padding:6px 12px;font-size:16px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.m-pill[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.lab-inputs{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lab-inputs select,.lab-inputs input{font-size:16px;padding:7px 12px}
.lab-inputs input[type=search]{min-width:260px}

/* Decision Cards & Notes */
.dec-card{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius);padding:18px;display:grid;gap:10px}
.dec-card.owner-hero{border:2px solid var(--surya)}
.dec-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.dec-statuses{display:flex;gap:6px;flex-wrap:wrap}
.st-btn{border:1px solid var(--line-strong);background:var(--surface-2);color:var(--muted);border-radius:var(--radius-sm);padding:5px 11px;font-size:15px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.st-btn[aria-pressed="true"][data-st="approved"]{background:rgba(21,98,61,.2);color:var(--up);border-color:var(--up)}
.st-btn[aria-pressed="true"][data-st="hold"]{background:rgba(154,116,38,.2);color:var(--warn);border-color:var(--warn)}
.st-btn[aria-pressed="true"][data-st="rejected"]{background:rgba(159,35,35,.2);color:var(--down);border-color:var(--down)}
.st-btn[aria-pressed="true"][data-st="pending"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.note-box{width:100%;font-size:16px;padding:9px 12px}
.notes-bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius);padding:12px 16px}

/* ========== MODALS & DRAWERS ========== */
.modal-backdrop,.drawer-backdrop{position:fixed;inset:0;background:rgba(8,14,22,.72);z-index:80;display:flex;align-items:center;justify-content:center;padding:24px}
.drawer-backdrop{justify-content:flex-end;padding:0}
.modal{width:min(940px,100%);max-height:90vh;overflow:auto;background:var(--surface);color:var(--text);border:1px solid var(--line-strong);border-radius:var(--radius);padding:24px}
.jumper-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:16px}
.j-card{text-align:left;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:var(--radius);padding:14px 16px;color:var(--text);display:grid;gap:4px}
.j-card:hover,.j-card.current{border-color:var(--surya)}
.j-num{font-size:14px;font-weight:800;color:var(--surya-ink)}
.j-title{font-size:1.05rem;font-weight:800;line-height:1.35}
.j-src{font-size:14px;color:var(--muted)}
.drawer{width:min(740px,100vw);height:100vh;background:var(--surface);color:var(--text);border-left:1px solid var(--line-strong);display:flex;flex-direction:column}
.drawer-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:18px 22px;border-bottom:1px solid var(--line)}
.drawer-head h3{margin:4px 0 0;font-size:1.25rem}
.drawer-body{padding:18px 22px;overflow:auto;display:grid;gap:14px}
.drawer-stats{display:flex;flex-wrap:wrap;gap:10px 18px;font-size:.9rem;color:var(--muted);padding:10px 14px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius)}
.drawer-stats b{color:var(--text)}

#toast{position:fixed;bottom:24px;right:24px;background:var(--text);color:var(--bg);padding:9px 16px;border-radius:var(--radius);font-size:15px;font-weight:700;z-index:120;opacity:0;pointer-events:none;transition:opacity .15s}
#toast.show{opacity:1}
#tip{position:fixed;display:none;z-index:110;background:var(--text);color:var(--bg);border-radius:var(--radius-sm);padding:8px 11px;font-size:.8rem;max-width:290px;pointer-events:none;line-height:1.45}
#more-hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:var(--text);color:var(--bg);font-size:14px;font-weight:700;padding:6px 14px;border-radius:var(--radius);z-index:30;pointer-events:none}
#print-deck,#print-notes{display:none}

/* ========== RESPONSIVE ========== */
@media(max-width:1280px){
  .p-bar{padding:8px 14px;gap:8px}
  .p-btn{padding:6px 11px;font-size:15px}
  .p-step-pill{font-size:15px;padding:5px 11px}
}
@media(max-width:960px){
  .split-2{grid-template-columns:1fr}
  .masthead{flex-direction:column;align-items:flex-start}
}
@media(max-width:720px){
  html,body{overflow-x:clip}
  .shell{width:min(100%,calc(100% - 28px))}
  .tabs{max-width:100%;overflow-x:auto}
  .filters input[type=search]{min-width:0;width:100%;max-width:100%}
  .ranked-row{grid-template-columns:34px 56px minmax(0,1fr);gap:10px}
  .ranked-metrics{grid-column:2 / -1;text-align:left;display:flex;gap:12px;align-items:baseline}
  #present-chrome{position:static}
  .p-dots,.p-keys{display:none}
  .p-bar{padding:8px 12px}
  .p-btn{font-size:14px;padding:5px 10px}
  body.present-mode .sec-head,body.present-mode .p-head{gap:10px}
  body.present-mode .p-subtab{font-size:15px;padding:6px 12px}
  .lab-inputs input[type=search]{min-width:0;width:100%}
  .brief-row{grid-template-columns:1fr;gap:2px}
}

/* ========== PRINT / PDF ========== */
@media print{
  :root,body.present-mode{
    --bg:#fff;--surface:#fff;--surface-2:#f6f5f2;--line:#cbd5e1;--line-strong:#94a3b8;
    --text:#111;--muted:#333;--quiet:#555;
    --surya:#76431C;--surya-ink:#76431C;--monster:#385397;--monster-ink:#385397;
    --up:#0a6b45;--down:#a02626;--warn:#7a4b00;--link:#1d4ed8;
  }
  body,body.present-mode{background:#fff!important;color:#111!important;font-size:10pt!important;line-height:1.45!important;cursor:auto!important}
  #present-chrome,.sticky,.head-actions button,.filters,.more,#tip,#drawer,#stop-jumper,#toast,#more-hint,.p-subtabs,.p-head-actions,.spotlight-nav,.lab-controls,.notes-bar,.st-btn,.pager,.btn{display:none!important}
  body.present-mode #analysis-chrome{display:block!important}
  body.present-mode #main>div.p-stage{display:none!important}
  #print-deck,#print-notes{display:block!important;margin-top:16px}

function readURL() {
  const qs = new URLSearchParams(location.search);
  const mode = qs.get('mode'); if (mode === 'present' || mode === 'analysis') S.mode = mode;
  const stop = parseInt(qs.get('stop'), 10); if (stop >= 1 && stop <= 7) S.stop = stop;
  const brand = qs.get('brand'); if (brand && ['Compare', ...BR].includes(brand)) S.brand = brand;
  const plat = qs.get('platform'); if (plat && ['All', ...PL].includes(plat)) S.platform = plat;
  const from = qs.get('from'); if (from && /^\d{4}-\d{2}-\d{2}$/.test(from)) S.from = from;
  const to = qs.get('to'); if (to && /^\d{4}-\d{2}-\d{2}$/.test(to)) S.to = to;
  const fmt = qs.get('format'); if (fmt && FORMATS.includes(fmt)) S.format = fmt;
  if (qs.get('norecruit') === '1') S.noRecruit = true;
  const pillar = qs.get('pillar'); if (pillar) S.pillar = pillar;
  const metric = qs.get('metric'); if (metric && METRICS[metric]) S.metric = metric;
  const q = qs.get('q'); if (q !== null) S.q = q;
}
function syncURL() {
  const qs = new URLSearchParams();
  qs.set('mode', S.mode);
  if (S.mode === 'present') qs.set('stop', String(S.stop));
  qs.set('brand', S.brand);
  qs.set('platform', S.platform);
  qs.set('from', S.from);
  qs.set('to', S.to);
  if (S.format !== 'All') qs.set('format', S.format);
  if (S.noRecruit) qs.set('norecruit', '1');
  if (S.pillar !== 'All') qs.set('pillar', S.pillar);
  if (S.metric !== 'reach') qs.set('metric', S.metric);
  if (S.q.trim()) qs.set('q', S.q.trim());
  history.replaceState(null, '', `${location.pathname}?${qs.toString()}`);
}

function bars(items, unit) {

    : '<p class="fine">ไม่มีโพสต์ที่มีข้อมูลในตัวกรองนี้</p>';
}

function lines(months, series, big = false) {
  const W = big ? 760 : 420, H = big ? 235 : 175, L = 46, R = 28, T = 18, B = 28;
  const max = Math.max(1, ...series.flatMap(s => s.pts.map(p => p.v || 0)));
  const x = i => L + (W - L - R) * (i / Math.max(1, months.length - 1));
  const y = v => T + (H - T - B) * (1 - v / max);
  const fs = big ? 'style="font-size:13px;font-weight:600"' : '';
  let g = [0, .5, 1].map(f => `<line x1="${L}" x2="${W - R}" y1="${y(max * f)}" y2="${y(max * f)}" stroke="var(--line)"/><text ${fs} x="${L - 8}" y="${y(max * f) + 4}" text-anchor="end">${n0(max * f)}</text>`).join('');
  g += months.map((m, i) => (big || i % 2 === (months.length - 1) % 2) ? `<text ${fs} x="${x(i)}" y="${H - 8}" text-anchor="middle">${TH[+m.slice(5) - 1]}</text>` : '').join('');
  for (const s of series) {
    const pts = s.pts.map((p, i) => p.v == null ? null : [x(i), y(p.v), p.v]);
    let d = '', pen = false;
    pts.forEach(pt => { if (!pt) { pen = false; return; } d += (pen ? 'L' : 'M') + pt[0].toFixed(1) + ' ' + pt[1].toFixed(1); pen = true; });
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${big ? 2.8 : 2}"/>`;
    g += pts.map(pt => pt ? `<circle cx="${pt[0]}" cy="${pt[1]}" r="${big ? 4.5 : 3.5}" fill="${s.color}" stroke="var(--surface)" stroke-width="1.5"/>` : '').join('');
    // Direct value labels on peak and latest non-null point
    const valid = pts.map((pt, idx) => pt ? {pt, idx} : null).filter(Boolean);
    if (valid.length) {
      const last = valid[valid.length - 1];
      const peak = [...valid].sort((a, b) => b.pt[2] - a.pt[2])[0];
      const labeled = peak.idx !== last.idx ? [peak, last] : [last];
      g += labeled.map(({pt}) => `<text class="val-lbl" x="${pt[0]}" y="${Math.max(11, pt[1] - 8)}" text-anchor="middle">${n0(pt[2])}</text>`).join('');
    }
  }
  g += months.map((m, i) => `<rect class="month-hit" data-month="${m}" x="${x(i) - 16}" y="${T}" width="32" height="${H - T - B}" fill="transparent" style="cursor:pointer" data-tip="<b>${TH[+m.slice(5) - 1]} ${m.slice(0, 4)}</b>${m === cutoff.slice(0, 7) ? ' (ยังไม่ครบเดือน)' : ''}<br>${series.map(s => `${esc(s.name)}: ${n0(s.pts[i].v)} (n=${s.pts[i].n})`).join('<br>')}<br><i>คลิกเพื่อดูโพสต์เดือนนี้</i>"/>`).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${g}</svg></div>`;
}

  for (const b of brands()) {
    for (const pl of plats()) {
      const a = stat(sel({brand: b, platform: pl, ...mtd}));
      const c = stat(sel({brand: b, platform: pl, ...prev}));
      const f = stat(sel({brand: b, platform: pl, ...base}));
      rows.push({b, pl, a, c, f});
    }
  }
  return `<div class="scroll"><table>
    <thead>
      <tr>
        <th class="l">Brand</th>
        <th class="l">Platform</th>
        <th>1–${cd} ${curLbl} ค่ากลาง (n)</th>
        <th>1–${+prev.to.slice(8)} ${prevLbl} ค่ากลาง (n)</th>
        <th>เทียบช่วงเดียวกัน</th>
        <th>ER ค่ากลาง (${curLbl} / ${prevLbl})</th>
        <th>รอซิงก์</th>
        <th>${prevLbl} ทั้งเดือน (n)</th>
        <th>Sum of post reach / views</th>
      </tr>
    </thead>
    <tbody>
      ${rows.map(({b, pl, a, c, f}) => {
        const attrs = interactive ? `class="drill-row" data-drill="kpi" data-brand="${esc(b)}" data-platform="${esc(pl)}" tabindex="0"` : '';
        return `<tr ${attrs}>
          <td class="l"><span class="bn-wrap">${brandMark(b, 16)}<span class="bn ${cls(b)}">${short(b)}</span></span></td>
          <td class="l"><span class="plat-tag plat-${pl}">${platLogo(pl, 15)}<span>${pl}</span></span></td>
          <td><b>${n0(a.reach)}</b> <span style="color:var(--quiet)">(${a.n})</span>${Math.min(a.n, c.n) < 5 ? ' <span class="kind partial">n&lt;5</span>' : ''}</td>
          <td>${n0(c.reach)} <span style="color:var(--quiet)">(${c.n})</span></td>
          <td>${deltaEl(a.reach, c.reach)}</td>
          <td><b>${p2(a.er)}</b> <span style="color:var(--quiet)">(${p2(c.er)})</span></td>
          <td>${a.pending || '—'}</td>
          <td>${n0(f.reach)} <span style="color:var(--quiet)">(${f.n})</span></td>
          <td>${n0(a.sum)} <span style="color:var(--quiet);font-size:.76em">${REACH(pl).toLowerCase()}</span></td>
        </tr>`;
      }).join('')}
    </tbody>
  </table></div>
  <p class="fine">โพสต์ ${curLbl} มีอายุน้อยกว่า ${prevLbl} ณ วันที่อ่านค่า ส่วนต่างจึงเอียงไปทางลบโดยธรรมชาติ · <b>Sum of post reach / views</b> เป็นยอดสะสมรายโพสต์ ไม่ใช่จำนวนคนไม่ซ้ำ · — = ไม่มีข้อมูลใน Publer (ไม่ใช่ศูนย์)${interactive ? ' · คลิกที่แถวเพื่อเปิดดูโพสต์เบื้องหลังตัวเลข' : ''}</p>`;
}

// ---------- Creative Post Rendering (Top 3 Showcase + Ranked Rows) ----------
function postHeroCard(p, i, metricKey = S.metric) {
  const src = M.sources.find(s => s.id === p.src), direct = src && src.trust === 'publer_direct', fb = p.platform === 'Facebook';
  const metricVal = metricKey === 'er' ? p2(p.er) : metricKey === 'dt' ? dth(p.dt) : n0(p[metricKey]);
  const metricLbl = metricKey === 'reach' ? REACH(p.platform) : (METRICS[metricKey] || METRICS.reach).split(' (')[0];
  const thumb = p.thumb
    ? `<div class="thumb"><img loading="lazy" src="${esc(p.thumb)}" alt="ภาพปกโพสต์"></div>`
    : `<div class="thumb-missing"><span>ไม่มีภาพปกในชุดข้อมูล (${p.platform} · ${p.format})</span></div>`;
  const sub = [
    metricKey !== 'reach' ? `<span>${REACH(p.platform)} <b>${n0(p.reach)}</b></span>` : '',
    metricKey !== 'er' ? `<span>ER <b>${p2(p.er)}</b></span>` : '',
    `<span>Shares <b>${n0(p.shares)}</b></span>`,
    `<span>${fb ? 'Link clicks' : p.platform === 'Instagram' ? 'Saves' : 'Comments'} <b>${n0(fb ? p.link_clicks : p.platform === 'Instagram' ? p.saves : p.comments)}</b></span>`
  ].filter(Boolean).join('');

  return `<article class="post-hero plat-${p.platform}" data-id="${p.id}">
    <div class="post-rank"><span>อันดับ #${i + 1}</span><span>${dth(p.dt)}</span></div>
    ${thumb}
    <h4>${esc(p.hook) || '(ไม่มีแคปชัน)'}</h4>
    <div class="primary-stat"><b>${metricVal}</b><span>${esc(metricLbl)}</span></div>
    <div class="sub-metrics">${sub}</div>
    <div class="meta-row">
      <span class="bn-wrap">${brandMark(p.brand, 15)}<span class="bn ${cls(p.brand)}">${short(p.brand)}</span></span>
      ${badge(p.platform)}
      <span class="badge">${esc(p.format)}</span>
      <span class="badge">${esc(p.pillar)}</span>
      <span class="kind ${direct ? 'agree' : 'partial'}" data-tip="${esc(src ? src.label : p.src)}">${direct ? 'Publer' : 'Gemini'}</span>
      <span>อายุ ${p.age} วัน</span>
      ${p.pending ? '<span class="kind medium">Reach รอซิงก์</span>' : ''}
      ${p.url ? `<a class="post-ext" href="${esc(p.url)}" target="_blank" rel="noopener">เปิดต้นทาง ${ico('external', 13)}</a>` : '<span>ไม่มีลิงก์</span>'}
    </div>
  </article>`;
}

function postRankedRow(p, i, metricKey = S.metric) {
  const src = M.sources.find(s => s.id === p.src), direct = src && src.trust === 'publer_direct';
  const metricVal = metricKey === 'er' ? p2(p.er) : metricKey === 'dt' ? dth(p.dt) : n0(p[metricKey]);
  const metricLbl = metricKey === 'reach' ? REACH(p.platform) : (METRICS[metricKey] || METRICS.reach).split(' (')[0];
  const thumb = p.thumb
    ? `<div class="ranked-thumb"><img loading="lazy" src="${esc(p.thumb)}" alt="ภาพปกโพสต์"></div>`
    : `<div class="ranked-thumb">${esc(p.format)}</div>`;
  return `<article class="ranked-row plat-${p.platform}" data-id="${p.id}">
    <div class="ranked-num">#${i + 1}</div>
    ${thumb}
    <div class="ranked-main">
      <h4>${esc(p.hook) || '(ไม่มีแคปชัน)'}</h4>
      <div class="meta-row">
        <span class="bn-wrap">${brandMark(p.brand, 14)}<span class="bn ${cls(p.brand)}">${short(p.brand)}</span></span>
        ${badge(p.platform)}
        <span class="badge">${esc(p.pillar)}</span>
        <span>${dth(p.dt)}</span>
        <span class="kind ${direct ? 'agree' : 'partial'}">${direct ? 'Publer' : 'Gemini'}</span>
        ${p.pending ? '<span class="kind medium">Reach รอซิงก์</span>' : ''}
        ${p.url ? `<a class="post-ext" href="${esc(p.url)}" target="_blank" rel="noopener">เปิดต้นทาง ${ico('external', 12)}</a>` : ''}
      </div>
    </div>
    <div class="ranked-metrics">
      <b>${metricVal}</b>
      <span>${esc(metricLbl)} · ER ${p2(p.er)}</span>
    </div>
  </article>`;
}

// ---------- Analysis Mode Sections ----------
function readout() {
  let items = (I.executive || []);
  if (S.brand !== 'Compare') {
    const t = (I.brands || {})[S.brand] || {};
    items = [...(t.worked || []), ...(t.underperformed || []), ...(t.why || []).map(w => ({...w, type: w.type === 'hypothesis' ? 'inference' : w.type}))];
  }
  const lead = items[0];
  const support = items.slice(1, 4);
  const rest = items.slice(4);
  return secHead('01', 'Executive Readout', S.brand === 'Compare' ? 'อะไรเปลี่ยน และรู้ได้แค่ไหน' : `${S.brand}: สรุปประเด็นสำคัญ`, 'Fact → Inference → สิ่งที่ต้องทดสอบ · ข้อความเขียนจากข้อมูล ณ ' + dth(I.written_for_as_of || ''), 'อ้างอิงบทวิเคราะห์') +
    (lead ? `<article class="lead-panel">
      <span class="kind ${lead.type}">${KIND[lead.type]}</span>
      <p class="lead-headline">${esc(lead.text)}</p>
      ${lead.source ? `<p class="lead-src">ที่มา: ${esc(lead.source)}</p>` : ''}
    </article>` : '<div class="empty">ไม่มีข้อเท็จจริงหลักในมุมมองนี้</div>') +
    (support.length ? `<div class="supporting-grid">${support.map(i => `<article class="supporting-item"><span class="kind ${i.type}">${KIND[i.type]}</span><p>${esc(i.text)}</p>${i.source ? `<small>ที่มา: ${esc(i.source)}</small>` : ''}</article>`).join('')}</div>` : '') +
    (rest.length ? `<details><summary>ดูประเด็นเพิ่มเติม (${rest.length} ข้อ)</summary><div class="supporting-grid" style="margin-top:12px">${rest.map(i => `<article class="supporting-item"><span class="kind ${i.type}">${KIND[i.type]}</span><p>${esc(i.text)}</p>${i.source ? `<small>ที่มา: ${esc(i.source)}</small>` : ''}</article>`).join('')}</div></details>` : '');
}

function scorecard() {
  return secHead('02', 'Account Scorecard', `โพสต์ 1–${cd} ${curLbl} เทียบ 1–${+prev.to.slice(8)} ${prevLbl}`, 'ค่ากลางต่อโพสต์ · Reach สำหรับ IG/FB · Views สำหรับ TikTok · คลิกที่แถวเพื่อดูโพสต์', `ช่วงเปรียบเทียบคงที่ · 1–${cd} ${curLbl} vs ${prevLbl}`) +
    scorecardTableHTML(true);
}

function audience() {
  const acc = (M.accounts || []).filter(a => brands().includes(a.brand) && plats().includes(a.platform));
  return secHead('03', 'Audience & Account Activity · Fact', 'ผู้ติดตามของแต่ละบัญชี', 'ตัวเลขระดับบัญชีจาก Publer แยกจากผลของโพสต์ในช่วงที่เลือก · ไม่รวมผู้ติดตามข้ามแพลตฟอร์ม', 'ระดับบัญชี (ไม่ขึ้นกับช่วงโพสต์)') +
    (acc.length
      ? `<div class="grid3">${acc.map(a => {
          const s = a.series, last = s[s.length - 1], first = s[0], ch = last[1] - first[1], mx = Math.max(...s.map(x => x[1])), mn = Math.min(...s.map(x => x[1]));
          return `<article class="card kpi-mini ${cls(a.brand)} plat-${a.platform}"><header><span class="bn-wrap">${brandMark(a.brand, 17)}<span class="bn">${short(a.brand).toUpperCase()}</span></span>${badge(a.platform)}</header><div class="big">${n0(last[1])}</div><div class="unit">ผู้ติดตาม · สัปดาห์ของ ${dth(last[0])} <span class="delta ${ch >= 0 ? 'up' : 'down'}">${ch >= 0 ? '+' : ''}${n0(ch)} (${(100 * ch / first[1]).toFixed(1)}%)</span></div><div class="spark" aria-hidden="true">${s.map(x => `<i data-tip="สัปดาห์ ${dth(x[0], 1)}: ${n0(x[1])}" style="height:${12 + 88 * (mx === mn ? 1 : (x[1] - mn) / (mx - mn))}%"></i>`).join('')}</div><p class="fine">ช่วง ${n0(mn)}–${n0(mx)} (แกนไม่เริ่มจากศูนย์) · ตั้งแต่ ${dth(first[0], 1)} · อ่านค่า ${dth(a.as_of)}</p></article>`;
        }).join('')}</div>`
      : '<div class="empty">ไม่มีข้อมูลระดับบัญชีในชุดข้อมูลนี้</div>');
}

function labRows() {
  const q = S.q.trim().toLowerCase(), k = S.metric;
  return sel().filter(p => (S.pillar === 'All' || p.pillar === S.pillar) && (k === 'dt' || p[k] != null) && (!q || p.hook.toLowerCase().includes(q))).sort((a, b) => k === 'dt' ? b.dt.localeCompare(a.dt) : b[k] - a[k] || b.dt.localeCompare(a.dt));
}

function contentLab() {
  const pillars = ['All', ...new Set(sel({noDate: true}).map(p => p.pillar))].sort((a, b) => a === 'All' ? -1 : b === 'All' ? 1 : a.localeCompare(b));
  if (!pillars.includes(S.pillar)) S.pillar = 'All';
  return `<div class="lab">${secHead('04', 'Content Lab', 'เจาะโพสต์จริง', 'Top 3 แสดงภาพและตัวเลขหลัก · แถวถัดไปเรียงเพื่อเทียบเร็ว · กดเปิดต้นทางเพื่อตรวจบริบท', `ใช้ตัวกรอง: ${activeScopeText()}`)}
    <div class="filters">
      <label>Content pillar<select id="l-pillar">${pillars.map(v => `<option${v === S.pillar ? ' selected' : ''}>${esc(v)}</option>`).join('')}</select></label>
      <label>จัดอันดับตาม<select id="l-metric">${Object.entries(METRICS).map(([k, v]) => `<option value="${k}"${k === S.metric ? ' selected' : ''}>${v}</option>`).join('')}</select></label>
      <label>ค้นหาในแคปชัน<input type="search" id="l-q" value="${esc(S.q)}" placeholder="เช่น GCWM, มัทฉะ"></label>
    </div>
    <div id="lab-out"></div>
  </div>`;
}

function renderLab() {
  const rr = labRows();
  if (!$('#lab-out')) return;
  if (!rr.length) {
    $('#lab-out').innerHTML = '<div class="empty">ไม่พบโพสต์ตามตัวกรองนี้</div>';
    return;
  }

  // Never mix TikTok Views with IG/FB Reach in one leaderboard when All platforms + reach is selected
  if (S.platform === 'All' && S.metric === 'reach') {
    const groups = PL.map(pl => {
      const sub = rr.filter(p => p.platform === pl);
      if (!sub.length) return '';
      return `<div class="plat-group">
        <div class="plat-group-head">
          <h3>${platLogo(pl, 18)}<span>${pl} · จัดอันดับตาม ${REACH(pl)}</span></h3>
          <span class="fine" style="margin:0">${sub.length} โพสต์ (แสดง ${Math.min(S.visible, sub.length)})</span>
        </div>
        <div class="podium-grid">${sub.slice(0, 3).map((p, i) => postHeroCard(p, i, S.metric)).join('')}</div>
        ${sub.length > 3 ? `<div class="ranked-list">${sub.slice(3, S.visible).map((p, i) => postRankedRow(p, i + 3, S.metric)).join('')}</div>` : ''}
      </div>`;
    }).filter(Boolean).join('');
    const maxLen = Math.max(...PL.map(pl => rr.filter(p => p.platform === pl).length));
    $('#lab-out').innerHTML = `<p class="hint">พบ <b>${rr.length}</b> โพสต์ · แยกกระดานตามแพลตฟอร์มเพื่อไม่นำ TikTok Views มารวมกับ IG/FB Reach · — = Publer ไม่ได้รายงาน</p>${groups}` +
      (S.visible < maxLen ? `<div class="more"><button class="btn" id="l-more" type="button">แสดงเพิ่มในทุกแพลตฟอร์ม</button></div>` : '');
  } else {
    $('#lab-out').innerHTML = `<p class="hint">พบ <b>${rr.length}</b> โพสต์ที่มีค่านี้ · ${HINT[S.metric]} · — = Publer ไม่ได้รายงาน</p>
      <div class="podium-grid">${rr.slice(0, 3).map((p, i) => postHeroCard(p, i, S.metric)).join('')}</div>
      ${rr.length > 3 ? `<div class="ranked-list">${rr.slice(3, S.visible).map((p, i) => postRankedRow(p, i + 3, S.metric)).join('')}</div>` : ''}
      <div class="more"><span class="fine">แสดง ${Math.min(S.visible, rr.length)} / ${rr.length} โพสต์</span>${S.visible < rr.length ? '<br><br><button class="btn" id="l-more" type="button">แสดงเพิ่ม</button>' : ''}</div>`;
  }

  bindThumbFallbacks('#lab-out');
  const m = $('#l-more');
  if (m) m.onclick = () => { S.visible += 9; renderLab(); };
}

function brandTablesHTML(b) {
  const rows = sel({brand: b}), g = {}; rows.forEach(p => { const k = `${p.pillar}|${p.platform}`; (g[k] ||= []).push(p); });
  const hrs = [...Array(24)].map((_, h) => { const sub = rows.filter(p => +p.dt.slice(11, 13) === h); return [h, sub.length, stat(sub).reach]; }).filter(x => x[1] >= 2);
  return `<div class="grid2" style="margin-top:12px">
    <div class="scroll"><table><tr><th class="l">Pillar × Platform</th><th>โพสต์</th><th>Reach/Views ค่ากลาง</th><th>ER ค่ากลาง</th><th>Share rate</th></tr>
      ${Object.entries(g).sort((a, c) => c[1].length - a[1].length).map(([k, v]) => { const [pil, pl] = k.split('|'), s = stat(v); return `<tr><td class="l">${esc(pil)} · ${pl}</td><td>${s.n}</td><td>${n0(s.reach)}</td><td>${p2(s.er)}</td><td>${p2(s.share)}</td></tr>`; }).join('')}
    </table></div>
    <div class="scroll"><table><tr><th class="l">Format</th><th>โพสต์</th><th>Reach/Views ค่ากลาง</th><th>ER ค่ากลาง</th></tr>
      ${FORMATS.slice(1).map(f => { const sub = rows.filter(p => p.format === f), s = stat(sub); return s.n ? `<tr><td class="l">${f}</td><td>${s.n}</td><td>${n0(s.reach)}</td><td>${p2(s.er)}</td></tr>` : ''; }).join('')}
    </table><p class="fine" style="padding:8px 12px;margin:0">ชั่วโมงโพสต์ (≥2 โพสต์): ${hrs.map(x => `${pad(x[0])}:00 (${x[1]} · ${n0(x[2])})`).join(', ') || 'ยังไม่พออ่าน'}</p></div>
  </div>`;
}

function patterns() {
  let h = secHead('05', 'Pattern Diagnostics', 'แยกตามกลุ่มคอนเทนต์และแพลตฟอร์ม', 'ค่าที่ติดป้ายจางคือ n<5 (อ่านเป็นทิศทางเท่านั้น) · คลิกแถบเพื่อดูโพสต์เบื้องหลัง', `ใช้ตัวกรอง: ${activeScopeText()}`);
  for (const b of brands()) {
    const t = (I.brands || {})[b] || {}, all = [...(t.worked || []), ...(t.underperformed || []), ...(t.why || [])];
    h += `<h3 style="margin:22px 0 12px;display:flex;align-items:center;gap:8px">${brandMark(b, 20)}<span>${esc(b)}</span></h3>`;
    if (all.length) {
      h += `<div class="grid2" style="margin-bottom:14px">${all.map(i => `<article class="supporting-item"><span class="kind ${i.type}">${KIND[i.type]}</span><p>${esc(i.text)}</p>${i.source ? `<small>ที่มา: ${esc(i.source)}</small>` : ''}</article>`).join('')}</div>`;
    }
    h += `<div class="grid3">`;
    for (const pl of plats()) {
      const g = {}; sel({brand: b, platform: pl}).forEach(p => (g[p.pillar] ||= []).push(p));
      const items = Object.entries(g).map(([k, v]) => ({k, short: k, label: plabel(b, k), v: stat(v).reach, n: v.length})).filter(i => i.v != null).sort((a, c) => c.v - a.v);
      h += `<div class="card ${cls(b)} plat-${pl}" data-pblock="${esc(b)}|${pl}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">${badge(pl)}<span class="fine" style="margin:0">${REACH(pl)} ค่ากลาง</span></div>
        ${bars(items, REACH(pl))}
      </div>`;
    }
    h += `</div><details><summary>ตาราง ${short(b)}: pillar × platform, format และชั่วโมงที่โพสต์</summary>${brandTablesHTML(b)}</details>`;
  }
  if (S.brand === 'Compare') {
    const wk = Math.max(1, (new Date(S.to) - new Date(S.from)) / 6048e5);
    h += `<h3 style="margin:24px 0 10px">เทียบสองแบรนด์ภายในแพลตฟอร์มเดียวกัน</h3>
    <div class="scroll"><table><tr><th class="l">Platform</th><th class="l">Brand</th><th>โพสต์</th><th>โพสต์/สัปดาห์</th><th>Reach/Views ค่ากลาง</th><th>ER ค่ากลาง</th><th>Share rate ค่ากลาง</th></tr>
      ${plats().flatMap(pl => BR.map(b => { const s = stat(sel({brand: b, platform: pl})); return `<tr><td class="l"><span class="plat-tag plat-${pl}">${platLogo(pl, 15)}<span>${pl}</span></span></td><td class="l"><span class="bn-wrap">${brandMark(b, 15)}<span>${b}</span></span></td><td>${s.n}</td><td>${(s.n / wk).toFixed(1)}</td><td>${n0(s.reach)}</td><td>${p2(s.er)}</td><td>${p2(s.share)}</td></tr>`; })).join('')}
    </table></div><p class="fine">ฐานผู้ติดตามของสองแบรนด์ต่างกัน Reach ที่สูงกว่าไม่ได้แปลว่าคอนเทนต์ดีกว่า · ห้ามเทียบ ER ข้ามแพลตฟอร์ม</p>`;
  }
  return h;
}

function trendsTableHTML() {
  const months = [...new Set(P.map(p => p.dt.slice(0, 7)))].sort();
  const ms = (b, pl, m) => stat(sel({brand: b, platform: pl, noDate: true}).filter(p => p.dt.startsWith(m)));

// ---------- One-Screen Paging for Presenter Stops ----------
const PAGE = 4;
function pager(stop, total) {
  const pages = Math.max(1, Math.ceil(total / PAGE));
  S.page[stop] = Math.min(Math.max(S.page[stop] || 0, 0), pages - 1);
  const cur = S.page[stop];
  return {
    start: cur * PAGE, end: cur * PAGE + PAGE,
    html: pages > 1 ? `<div class="pager"><button type="button" class="icon-circle" data-page="${stop}:-1" ${cur === 0 ? 'disabled' : ''} aria-label="หน้าก่อนหน้า">${ico('prev', 18)}</button><span class="badge">หน้า ${cur + 1} / ${pages} · ${total} รายการ</span><button type="button" class="icon-circle" data-page="${stop}:1" ${cur >= pages - 1 ? 'disabled' : ''} aria-label="หน้าถัดไป">${ico('next', 18)}</button></div>` : ''
  };
}

      ${months.map(m => `<button type="button" class="p-btn" style="padding:5px 11px;font-size:15px" data-month="${m}">${TH[+m.slice(5) - 1]} ${m.slice(2, 4)}${m === cutoff.slice(0, 7) ? ' (MTD)' : ''}</button>`).join('')}
    </div>`;
}

function renderBrandSpotlight(targetBrand, stopNum) {
  const t = (I.brands || {})[targetBrand] || {};
  const worked = t.worked || [];
  const under = t.underperformed || [];
  const why = (t.why || []).map(w => ({...w, type: w.type === 'hypothesis' ? 'inference' : w.type}));
  const activeTab = S.sub[stopNum] || 'worked';
  const themeCls = targetBrand === 'SURYA' ? 'SURYA-theme' : 'Monster-theme';

  const notice = (S.brand !== 'Compare' && S.brand !== targetBrand)
    ? `<div class="spotlight"><div><p style="margin:0">ตัวกรองปัจจุบันเลือกเฉพาะ <b>${esc(S.brand)}</b> (หน้านี้แสดงข้อมูลของ <b>${esc(targetBrand)}</b>)</p></div><button class="p-btn" type="button" data-setbrand="Compare">เปิดเทียบทั้งสองแบรนด์</button></div>` : '';

  const tabItems = activeTab === 'worked' ? worked : activeTab === 'under' ? under : why;
  const subtabs = `<div class="p-subtabs" role="tablist">
    <button class="p-subtab" role="tab" aria-selected="${activeTab === 'worked'}" data-sub="${stopNum}:worked">ได้ผลดี (${worked.length})</button>
    <button class="p-subtab" role="tab" aria-selected="${activeTab === 'under'}" data-sub="${stopNum}:under">ยังต่ำ (${under.length})</button>
    <button class="p-subtab" role="tab" aria-selected="${activeTab === 'why'}" data-sub="${stopNum}:why">สมมติฐาน (${why.length})</button>
  </div>`;

  const leftCol = `<div class="${themeCls}" style="display:grid;gap:12px">
    ${subtabs}
    ${tabItems.map(i => `<article class="supporting-item"><span class="kind ${i.type}">${KIND[i.type]}</span><p>${esc(i.text)}</p>${i.source ? `<small>ที่มา: ${esc(i.source)}</small>` : ''}</article>`).join('')}
  </div>`;

  const plList = plats();
  const focusPlat = plList.includes(S.spotPlat) ? S.spotPlat : plList[0];
  const g = {}; sel({brand: targetBrand, platform: focusPlat}).forEach(p => (g[p.pillar] ||= []).push(p));
  const items = Object.entries(g).map(([k, v]) => { const st = stat(v); return {k, label: plabel(targetBrand, k), v: st.reach, n: st.n, er: st.er}; }).filter(i => i.v != null).sort((a, b) => b.v - a.v);
  const max = Math.max(...items.map(i => i.v), 1);
  const ok = Object.entries(g).filter(([k, v]) => v.length >= 5 && k !== 'Other').map(([k, v]) => ({k, ...stat(v)})).filter(x => x.reach != null);
  let factLine = '';
  if (ok.length) {
    const r = [...ok].sort((x, y) => y.reach - x.reach)[0], e = [...ok].sort((x, y) => (y.er ?? -1) - (x.er ?? -1))[0];
    factLine = `<p class="fine" style="margin:6px 0 8px;color:var(--accent)"><b>Fact:</b> ${esc(r.k)} ${REACH(focusPlat)} ค่ากลางสูงสุด ${n0(r.reach)} (n=${r.n})${e.k !== r.k ? ` · ${esc(e.k)} ER สูงสุด ${p2(e.er)} (n=${e.n})` : ` · ER สูงสุด ${p2(e.er)}`}</p>`;
  }

  const platBtns = plList.length > 1
    ? `<div style="display:flex;gap:6px;flex-wrap:wrap">${plList.map(pl => `<button type="button" class="p-btn ${focusPlat === pl ? 'active' : ''}" data-splat="${pl}" style="padding:5px 12px;font-size:15px">${platLogo(pl, 14)}${pl}</button>`).join('')}</div>` : '';

  const rightCol = `<div style="display:grid;gap:12px">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      ${platBtns || '<span class="fine" style="margin:0">Pillar breakdown (n&lt;5 แสดงจาง)</span>'}
      <button class="p-btn" type="button" data-drawer="brand-tables" data-brand="${esc(targetBrand)}">${ico('list', 15)} ตารางละเอียด ${esc(short(targetBrand))}</button>
    </div>
    <div class="card ${cls(targetBrand)} plat-${focusPlat}">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">${badge(focusPlat)}<span class="fine" style="margin:0">${REACH(focusPlat)} ค่ากลางต่อโพสต์ · กดแถบเพื่อดูโพสต์</span></div>
      ${factLine}
      <div class="pbar-list">
        ${items.length ? items.map(it => `
          <button type="button" class="pbar-row${it.n < 5 ? ' thin-row' : ''}" data-drill="pillar" data-brand="${esc(targetBrand)}" data-platform="${esc(focusPlat)}" data-pillar="${esc(it.k)}" title="${esc(it.label)} · ER ค่ากลาง ${p2(it.er)}">
            <span class="pbar-lbl">${esc(it.k)}</span>
            <span class="pbar-track"><span class="pbar-fill" style="width:${Math.max(4, 100 * it.v / max)}%"></span></span>
            <span class="pbar-val">${n0(it.v)} <small>(n=${it.n})</small></span>
          </button>`).join('') : '<p class="fine">ไม่มีโพสต์ในช่วงตัวกรองนี้</p>'}
      </div>
    </div>
  </div>`;

  return `${notice}<div class="split-2">${leftCol}${rightCol}</div>`;
}

function renderStop5() {
  const pillars = ['All', ...new Set(sel({noDate: true}).map(p => p.pillar))].sort((a, b) => a === 'All' ? -1 : b === 'All' ? 1 : a.localeCompare(b));
  if (!pillars.includes(S.pillar)) S.pillar = 'All';
  const rr = labRows();
  const pillMetrics = [['reach', 'Reach / Views'], ['er', 'ER'], ['shares', 'Shares'], ['saves', 'Saves (IG)'], ['link_clicks', 'Link clicks (FB)'], ['comments', 'Comments'], ['dt', 'ล่าสุด']];

  const controls = `<div class="lab-controls">
    <div class="metric-pills">${pillMetrics.map(([k, lbl]) => `<button type="button" class="m-pill" data-metric="${k}" aria-pressed="${S.metric === k}">${lbl}</button>`).join('')}</div>
    <div class="lab-inputs">
      <select id="p-pillar" aria-label="Content pillar">${pillars.map(v => `<option${v === S.pillar ? ' selected' : ''}>${esc(v)}</option>`).join('')}</select>
      <input type="search" id="p-q" value="${esc(S.q)}" placeholder="ค้นหาแคปชัน (เช่น GCWM, มัทฉะ)" aria-label="ค้นหาในแคปชัน">
    </div>
  </div>`;

  let bodyHTML = '';
  if (!rr.length) {
    bodyHTML = `<div class="empty">ไม่พบโพสต์ตามตัวกรองนี้ (${esc(METRICS[S.metric])}) ${S.metric !== 'reach' ? '<br><br><button class="p-btn" type="button" data-metric="reach">กลับไปเรียงตาม Reach / Views</button>' : ''}</div>`;
  } else if (S.platform === 'All' && S.metric === 'reach') {
    // Separate top post per platform instead of mixing TikTok Views with IG/FB Reach
    const perPlat = PL.map(pl => {
      const sub = rr.filter(p => p.platform === pl);
      return sub.length ? `<div><p class="eyebrow" style="margin:0 0 8px;display:flex;align-items:center;gap:6px">${platLogo(pl, 14)}<span>Top ${pl} (${REACH(pl)}) · ${sub.length} โพสต์</span></p>${postHeroCard(sub[0], 0, S.metric)}</div>` : '';
    }).filter(Boolean).join('');
    bodyHTML = `<div class="grid3">${perPlat}</div>`;
  } else {
    bodyHTML = `<div class="podium-grid">${rr.slice(0, 3).map((p, i) => postHeroCard(p, i, S.metric)).join('')}</div>`;
  }

  const footer = `<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
    <span class="fine" style="margin:0">พบ <b>${rr.length}</b> โพสต์ · ${S.platform === 'All' && S.metric === 'reach' ? 'แสดงอันดับ 1 แยกตามแพลตฟอร์ม (ไม่เทียบ Views กับ Reach ข้ามแพลตฟอร์ม)' : HINT[S.metric]} · — = Publer ไม่ได้รายงาน</span>
    ${rr.length ? `<button class="p-btn" type="button" data-drawer="all-posts">${ico('list', 16)} ดูโพสต์ทั้งหมด (${rr.length} โพสต์) →</button>` : ''}
  </div>`;

  return `${controls}${bodyHTML}${footer}`;
}

function renderStop6() {

  const exps = (I.next_month || []).filter(x => x.type === 'experiment' && (S.brand === 'Compare' || !/^(SURYA|Monster)/.test(x.title) || x.title.startsWith(short(S.brand))));

    <button class="p-subtab" role="tab" aria-selected="${activeTab === 'exps'}" data-sub="6:exps">การทดลองเดือนหน้า (${exps.length})</button>

function renderStop7() {
  const items = allDecisionItems().filter(it => S.brand === 'Compare' || it.brand === S.brand || it.brand === 'ทั้งสองแบรนด์');
  const activeTab = S.sub[7] || 'decision';
  const decItems = items.filter(it => it.group === 'decision');
  const restItems = items.filter(it => it.group !== 'decision').filter(it => {
    if (activeTab === 'exps') return it.group === 'exp';
    if (activeTab === 'recs') return it.group === 'rec';
    if (activeTab === 'pending') return getNote(it.key).status === 'pending';
    return true;
  });

  const cardFor = (it, isHero = false) => {
    const cur = getNote(it.key);
    return `<article class="dec-card${isHero ? ' owner-hero' : ''}" data-key="${esc(it.key)}" data-status="${esc(cur.status)}">
      <div class="dec-top">
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="kind ${it.type}">${KIND[it.type]}</span><span class="badge">${esc(it.brand)}</span></div>
        <div class="dec-statuses">${Object.entries(STATUS_LABELS).map(([st, lbl]) => `<button type="button" class="st-btn" data-st="${st}" data-notekey="${esc(it.key)}" aria-pressed="${cur.status === st}">${lbl}</button>`).join('')}</div>
      </div>
      <h3 style="font-size:1.15rem">${esc(it.title)}</h3>
      <p style="margin:0;font-size:17px;color:var(--muted)">${esc(it.text)}</p>
      <p class="fine" style="margin:0;color:var(--surya-ink)">${esc(it.detail)}</p>
      <input type="text" class="note-box" data-noteinput="${esc(it.key)}" value="${esc(cur.note)}" placeholder="บันทึกมติ / ผู้รับผิดชอบ / กำหนดเวลา...">
    </article>`;
  };

  const approvedN = items.filter(it => getNote(it.key).status === 'approved').length;
  const savedTime = NOTES.updated_at ? `บันทึกล่าสุด ${dth(NOTES.updated_at.slice(0, 16))}` : 'ยังไม่มีการแก้ไข';

  const subtabs = `<div class="p-subtabs" role="tablist">
    <button class="p-subtab" role="tab" aria-selected="${activeTab === 'decision'}" data-sub="7:decision">ต้องตัดสินใจ (${decItems.length})</button>
    <button class="p-subtab" role="tab" aria-selected="${activeTab === 'all'}" data-sub="7:all">ทั้งหมด (${items.length - decItems.length})</button>
    <button class="p-subtab" role="tab" aria-selected="${activeTab === 'exps'}" data-sub="7:exps">การทดลอง (${items.filter(i => i.group === 'exp').length})</button>
    <button class="p-subtab" role="tab" aria-selected="${activeTab === 'recs'}" data-sub="7:recs">ข้อเสนอ (${items.filter(i => i.group === 'rec').length})</button>
    <button class="p-subtab" role="tab" aria-selected="${activeTab === 'pending'}" data-sub="7:pending">รอตัดสินใจ</button>
  </div>`;

  const storageBar = `<div class="notes-bar">
    <div style="font-size:16px">บันทึกอัตโนมัติในเบราว์เซอร์เครื่องนี้ (<code>localStorage: cpi_v2_meeting_notes</code>) · อนุมัติแล้ว <b>${approvedN}/${items.length}</b> · <span id="notes-ts">${savedTime}</span></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button type="button" class="p-btn" id="copy-notes-btn">${ico('copy', 15)} คัดลอกสรุป</button>
      <button type="button" class="p-btn" id="export-notes-btn">${ico('download', 15)} JSON</button>
      <button type="button" class="p-btn" id="print-notes-btn">${ico('print', 15)} พิมพ์ / PDF</button>
      <button type="button" class="p-btn" id="clear-notes-btn">${ico('trash', 15)} ล้างบันทึก</button>
    </div>
  </div>`;

  if (activeTab === 'decision') return `${subtabs}${decItems.map(it => cardFor(it, true)).join('') || '<div class="empty">ไม่มีรายการที่ต้องตัดสินใจ</div>'}${storageBar}`;
  const pg = pager(7, restItems.length);
  return `<div class="tabs-row">${subtabs}${pg.html}</div>
    <div class="grid2">${restItems.length ? restItems.slice(pg.start, pg.end).map(it => cardFor(it, false)).join('') : '<div class="empty">ไม่มีรายการในมุมมองนี้</div>'}</div>
    <p class="fine" style="margin:0">บันทึกอัตโนมัติในเบราว์เซอร์เครื่องนี้ · อนุมัติแล้ว <b>${approvedN}/${items.length}</b> · คัดลอก ดาวน์โหลด หรือพิมพ์ได้ที่แท็บ “ต้องตัดสินใจ”</p>`;
}

// ---------- Drawers ----------
function openDrawer({kicker, title, html, bind}) {
  $('#drawer-kicker').textContent = kicker;
  $('#drawer-title').textContent = title;
  $('#drawer-body').innerHTML = html;
  $('#drawer').hidden = false;
  bindThumbFallbacks('#drawer-body');
  if (bind) bind();
}
function closeDrawer() { $('#drawer').hidden = true; }

function openPostsDrawer({kicker, title, rows, metric = 'reach', periodSwitch = null}) {
  const s = stat(rows);
  const plSet = new Set(rows.map(r => r.platform));
  const plLabel = plSet.size === 1 ? REACH([...plSet][0]) : 'Reach / Views';
  const sorted = [...rows].sort((a, b) => metric === 'dt' ? b.dt.localeCompare(a.dt) : (b[metric] ?? -1) - (a[metric] ?? -1) || b.dt.localeCompare(a.dt));
  const switchBar = periodSwitch ? `<div class="p-subtabs">${periodSwitch.map(opt => `<button type="button" class="p-subtab" aria-selected="${opt.active}" data-dperiod="${opt.id}">${esc(opt.label)}</button>`).join('')}</div>` : '';

  const html = `${switchBar}
    <div class="drawer-stats">
      <span>โพสต์: <b>${s.n}</b></span>
      <span>${plLabel} ค่ากลาง: <b>${n0(s.reach)}</b></span>
      ${plSet.size === 1 ? `<span>ER ค่ากลาง: <b>${p2(s.er)}</b></span>` : '<span>ER: ไม่เทียบข้ามแพลตฟอร์ม</span>'}
      <span>Sum of post ${plLabel.toLowerCase()}: <b>${n0(s.sum)}</b></span>
      ${s.pending ? `<span class="caution" style="margin:0">รอซิงก์ ${s.pending} โพสต์</span>` : ''}
    </div>
    ${sorted.length ? `<div class="ranked-list" style="margin-top:0">${sorted.map((p, i) => postRankedRow(p, i, metric)).join('')}</div>` : '<div class="empty">ไม่มีโพสต์ในช่วงตัวกรองนี้</div>'}`;

  openDrawer({
    kicker, title, html,
    bind: () => {
      document.querySelectorAll('#drawer-body [data-dperiod]').forEach(btn => {
        btn.onclick = () => { const opt = periodSwitch.find(o => o.id === btn.dataset.dperiod); if (opt) opt.open(); };
      });
    }
  });
}

function openKpiDrawer(brand, platform, periodId = 'mtd') {
  const opts = [
    {id: 'mtd', label: `1–${cd} ${curLbl} (${stat(sel({brand, platform, ...mtd})).n})`, range: mtd},
    {id: 'prev', label: `1–${+prev.to.slice(8)} ${prevLbl} (${stat(sel({brand, platform, ...prev})).n})`, range: prev},
    {id: 'base', label: `${prevLbl} ทั้งเดือน (${stat(sel({brand, platform, ...base})).n})`, range: base}
  ];
  const active = opts.find(o => o.id === periodId) || opts[0];
  openPostsDrawer({
    kicker: `DRILL-DOWN · ${short(brand).toUpperCase()} · ${platform.toUpperCase()}`,
    title: `${brand} · ${platform} (${active.label.split(' (')[0]})`,
    rows: sel({brand, platform, ...active.range}),
    periodSwitch: opts.map(o => ({id: o.id, label: o.label, active: o.id === active.id, open: () => openKpiDrawer(brand, platform, o.id)}))
  });
}

function openPillarDrawer(brand, platform, pillar) {

// ---------- Meeting motion: entrance, count-up, line draw, brand stops ----------
let lastStopShown = 0;
const reducedMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function countUp(root) {
  if (reducedMotion()) return;
  root.querySelectorAll('[data-count], .kpi-mini .big').forEach(el => {
    const finalText = el.textContent.trim();
    const m = finalText.match(/^([\d,]+(?:\.\d+)?)(%?)$/);
    if (!m) return;
    const target = parseFloat(m[1].replace(/,/g, '')), dec = (m[1].split('.')[1] || '').length, suf = m[2];
    if (!target) return;
    const fmt = v => v.toLocaleString('en-US', {minimumFractionDigits: dec, maximumFractionDigits: dec}) + suf;
    const t0 = performance.now(), dur = 900;
    let done = false;
    const finish = () => { if (!done) { done = true; el.textContent = finalText; } };
    const step = now => { if (done) return; const k = Math.min(1, (now - t0) / dur); el.textContent = fmt(target * (1 - Math.pow(1 - k, 3))); k < 1 ? requestAnimationFrame(step) : finish(); };
    el.textContent = fmt(0);
    requestAnimationFrame(step);
    setTimeout(finish, dur + 150); // never leave a number unfinished if frames are paused
  });
}
function applyMeetingMotion() {
  const stage = document.querySelector('#main .p-stage');
  if (!stage) return;
  stage.dataset.dir = S.stop === lastStopShown ? 'same' : S.stop > lastStopShown ? 'next' : 'prev';
  [...stage.children].forEach((el, i) => el.style.setProperty('--i', i));
  stage.querySelectorAll('svg path').forEach(path => {
    if ((path.getAttribute('fill') || '') === 'none' && path.getAttribute('d')) { path.setAttribute('pathLength', '1'); path.classList.add('draw'); }
  });
  document.body.classList.toggle('stop-surya', S.stop === 3);
  document.body.classList.toggle('stop-monster', S.stop === 4);
  if (S.stop === 4) {
    const head = stage.querySelector('.p-head');
    if (head && !head.querySelector('.confetti')) {
      const bits = [['6%', '-9px', '-18deg', '#FED347'], ['22%', 'calc(100% - 4px)', '12deg', '#B4D7AC'], ['41%', '-8px', '24deg', '#EBBBC6'],
        ['63%', 'calc(100% - 5px)', '-14deg', '#FED347'], ['79%', '-10px', '9deg', '#B4D7AC'], ['93%', '38%', '-28deg', '#EBBBC6'], ['-1%', '55%', '30deg', '#B4D7AC']];
      head.insertAdjacentHTML('afterbegin', `<span class="confetti" aria-hidden="true">${bits.map(([x, y, r, c], d) => `<i style="--x:${x};--y:${y};--r:${r};--c:${c};--d:${d}"></i>`).join('')}</span>`);
    }
  }
  countUp(stage);
  fitStage();
  lastStopShown = S.stop;
}
// Scale a stop down (never up, never below 72%) only when it would overflow the screen.
function fitStage() {
  const stage = document.querySelector('#main .p-stage');
  if (!stage || S.mode !== 'present') return;
  stage.style.zoom = '1';
  if (innerWidth < 900) { stage.style.zoom = ''; updateMoreHint(); return; } // phones scroll; never shrink text there
  const avail = innerHeight - (stage.getBoundingClientRect().top + scrollY) - 34;
  const need = stage.scrollHeight;
  stage.style.zoom = need > avail && avail > 200 ? String(Math.max(0.72, avail / need).toFixed(3)) : '';
  updateMoreHint();
}
addEventListener('resize', () => { clearTimeout(fitStage._t); fitStage._t = setTimeout(fitStage, 120); });

// ---------- Keyboard Shortcuts ----------
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;

  if (e.key === 'Escape') {
    if (!$('#drawer').hidden) { closeDrawer(); return; }
    if (!$('#stop-jumper').hidden) { $('#stop-jumper').hidden = true; return; }
    if (!$('#p-filter-tray').hidden) { $('#p-filter-tray').hidden = true; $('#p-more-btn').setAttribute('aria-expanded', 'false'); $('#p-more-btn').classList.remove('active'); return; }
    return;
  }
  if (typing) return;

  if (e.key === 'p' || e.key === 'P') { e.preventDefault(); setMode(S.mode === 'present' ? 'analysis' : 'present'); return; }
  if (S.mode !== 'present') return;

  const drawerOpen = !$('#drawer').hidden;
  const jumperOpen = !$('#stop-jumper').hidden;
  if (!drawerOpen && !jumperOpen) {
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || (e.key === ' ' && tag !== 'button') || e.key === 'ArrowDown') {
      e.preventDefault(); if (S.stop < STOPS.length) goToStop(S.stop + 1); return;
    }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'ArrowUp') {
      e.preventDefault(); if (S.stop > 1) goToStop(S.stop - 1); return;
    }
  }
  if (/^[1-7]$/.test(e.key)) { e.preventDefault(); goToStop(parseInt(e.key, 10)); return; }
  if (e.key === 'g' || e.key === 'G') { e.preventDefault(); $('#stop-jumper').hidden ? openJumper() : ($('#stop-jumper').hidden = true); return; }
  if (e.key === 'b' || e.key === 'B') {
    e.preventDefault();
    const order = ['Compare', ...BR];
    S.brand = order[(order.indexOf(S.brand) + 1) % order.length];
    syncFilterInputs(); syncURL(); render(); return;
  }
  if (e.key === 't' || e.key === 'T') {
    e.preventDefault();
    const order = ['All', ...PL];
    S.platform = order[(order.indexOf(S.platform) + 1) % order.length];
    syncFilterInputs(); syncURL(); render(); return;
  }
  if (e.key === 'f' || e.key === 'F') {
    e.preventDefault();
    const tray = $('#p-filter-tray'); tray.hidden = !tray.hidden;
    $('#p-more-btn').setAttribute('aria-expanded', String(!tray.hidden));
    $('#p-more-btn').classList.toggle('active', !tray.hidden); return;
  }
  if (e.key === 'r' || e.key === 'R') { e.preventDefault(); resetFilters(); return; }
  if (e.key === 'm' || e.key === 'M') { e.preventDefault(); $('#drawer').hidden ? openMethodDrawer() : closeDrawer(); return; }
});

// ---------- Initialization ----------
function init() {
  readURL();
  $('#h-period').textContent = `${EN[cm - 1]} ${cy} MTD`;
  document.title = `Creative Performance Intelligence · ${EN[cm - 1]} ${cy} MTD | COFFLORER`;
  $('#h-snap').textContent = `PUBLER SNAPSHOT · ${dth(M.latest_source_as_of)}`;
  $('#toPresentBtn').innerHTML = `${ico('present', 16)} โหมดนำเสนอ (Presenter)`;
  $('#printBtn').innerHTML = `${ico('print', 16)} พิมพ์ / บันทึก PDF`;
  $('#p-prev').innerHTML = `${ico('prev', 16)} ก่อนหน้า`;
  $('#p-next').innerHTML = `ถัดไป ${ico('next', 16)}`;
  $('#p-more-btn').innerHTML = `${ico('filter', 16)} ตัวกรอง (F)`;
  $('#p-reset').innerHTML = `${ico('reset', 16)} รีเซ็ต (R)`;
  $('#p-tray-reset').innerHTML = `${ico('reset', 16)} รีเซ็ตทั้งหมด (R)`;
  $('#p-method-btn').innerHTML = `${ico('book', 16)} Method (M)`;
  $('#p-fs-btn').innerHTML = `${ico('expand', 16)} เต็มจอ`;
  $('#toAnalysisBtn').innerHTML = `${ico('analysis', 16)} โหมดวิเคราะห์`;

  $('#banner').innerHTML = `<strong>${esc(I.status || 'DRAFT')}</strong><span>Refresh ล่าสุด <b>${dth(M.generated_at)}</b></span><span>อ่านค่า Publer ล่าสุด <b>${dth(M.latest_source_as_of)}</b></span><span>โพสต์ล่าสุด <b>${dth(M.latest_post)}</b></span><span><b>${M.posts.toLocaleString()}</b> โพสต์ไม่ซ้ำ · ${M.timezone} · Snapshot (ไม่ใช่ real-time)</span>`;
  if (I.written_for_as_of && I.written_for_as_of < M.latest_source_as_of) {
    $('#stale').hidden = false;
    $('#stale').innerHTML = `<strong>ข้อมูลใหม่กว่าบทวิเคราะห์</strong><span>ข้อความสรุปเขียนจากข้อมูล ณ ${dth(I.written_for_as_of)} ตัวเลขในตารางเป็นปัจจุบันกว่า</span>`;
  }
  $('#foot').textContent = `COFFLORER · Creative Performance Intelligence · ร่างสำหรับตรวจภายใน · ข้อมูล Publer ณ ${dth(M.latest_source_as_of)} · จำนวนโพสต์นับรายแพลตฟอร์ม ไม่ใช่จำนวนชิ้นงานไม่ซ้ำ`;

  const fill = (el, list, v) => el.innerHTML = list.map(x => `<option${x === v ? ' selected' : ''}>${esc(x)}</option>`).join('');
  fill($('#s-platform'), ['All', ...PL], S.platform);
  fill($('#s-format'), FORMATS, S.format);
  fill($('#p-format'), FORMATS, S.format);
  fill($('#s-preset'), Object.keys(PRESETS), matchingPreset());

  const applyUpdate = () => { S.visible = 9; syncFilterInputs(); syncURL(); render(); };

  for (const k of ['from', 'to']) {
    for (const prefix of ['#s-', '#p-']) {
      const el = $(prefix + k);
      el.min = firstDay; el.max = cutoff; el.value = S[k];
      el.onchange = () => { if (el.value) { S[k] = el.value; applyUpdate(); } };
    }
  }
  $('#s-preset').onchange = e => { const r = PRESETS[e.target.value]; if (r) { [S.from, S.to] = r; applyUpdate(); } };
  $('#p-preset').onchange = e => { const r = PRESETS[e.target.value]; if (r) { [S.from, S.to] = r; applyUpdate(); } else { $('#p-filter-tray').hidden = false; } };
  $('#s-platform').onchange = e => { S.platform = e.target.value; applyUpdate(); };
  $('#s-format').onchange = e => { S.format = e.target.value; applyUpdate(); };
  $('#p-format').onchange = e => { S.format = e.target.value; applyUpdate(); };
  $('#s-recruit').onchange = e => { S.noRecruit = e.target.checked; applyUpdate(); };
  $('#p-recruit').onchange = e => { S.noRecruit = e.target.checked; applyUpdate(); };
  $('#tabs').onclick = e => { const b = e.target.closest('button'); if (b) { S.brand = b.dataset.brand; applyUpdate(); } };

  $('#p-prev').onclick = () => { if (S.stop > 1) goToStop(S.stop - 1); };
  $('#p-next').onclick = () => { if (S.stop < STOPS.length) goToStop(S.stop + 1); };
  $('#p-where').onclick = e => {
    const dot = e.target.closest('[data-dot]');
    if (dot) { goToStop(parseInt(dot.dataset.dot, 10)); return; }
    $('#stop-jumper').hidden ? openJumper() : ($('#stop-jumper').hidden = true);
  };
  $('#p-brands').onclick = e => { const b = e.target.closest('[data-pbrand]'); if (b) { S.brand = b.dataset.pbrand; applyUpdate(); } };
  $('#p-plats').onclick = e => { const b = e.target.closest('[data-pplat]'); if (b) { S.platform = b.dataset.pplat; applyUpdate(); } };
  $('#p-more-btn').onclick = () => {
    const tray = $('#p-filter-tray'); tray.hidden = !tray.hidden;
    $('#p-more-btn').setAttribute('aria-expanded', String(!tray.hidden));
    $('#p-more-btn').classList.toggle('active', !tray.hidden);
  };
  $('#p-reset').onclick = resetFilters;
  $('#p-tray-reset').onclick = resetFilters;
  $('#p-method-btn').onclick = () => $('#drawer').hidden ? openMethodDrawer() : closeDrawer();
  $('#p-fs-btn').onclick = () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
    else document.exitFullscreen?.().catch(() => {});
  };
  document.addEventListener('fullscreenchange', () => {
    $('#p-fs-btn').innerHTML = document.fullscreenElement ? `${ico('compress', 16)} ออกเต็มจอ` : `${ico('expand', 16)} เต็มจอ`;
  });

  $('#toAnalysisBtn').onclick = () => setMode('analysis');
  $('#toPresentBtn').onclick = () => setMode('present');
  $('#printBtn').onclick = () => triggerPrint();
  window.addEventListener('beforeprint', () => {
    $('#print-scope-banner').innerHTML = `<strong>ขอบเขตที่พิมพ์:</strong> ${esc(activeScopeText())} · ข้อมูล Publer ณ ${dth(M.latest_source_as_of)} · เอกสารร่าง (ยังไม่ปิดเดือน ${curLbl})`;
    $('#print-scope-banner').hidden = false;
    if (S.mode === 'present') {
      const deck = $('#print-deck');
      if (deck) deck.innerHTML = buildPrintDeck();
    } else {
      document.querySelectorAll('details').forEach(d => d.open = true);
    }
  });

  $('#drawer-close').onclick = closeDrawer;
  $('#drawer').onclick = e => { if (e.target === $('#drawer')) closeDrawer(); };
  $('#jumper-close').onclick = () => $('#stop-jumper').hidden = true;
  $('#stop-jumper').onclick = e => { if (e.target === $('#stop-jumper')) $('#stop-jumper').hidden = true; };

  document.addEventListener('mousemove', e => {
    const t = e.target.closest?.('[data-tip]'), tip = $('#tip');
    if (!t) { tip.style.display = 'none'; return; }
    tip.innerHTML = t.dataset.tip; tip.style.display = 'block';
    tip.style.left = Math.min(e.clientX + 12, innerWidth - 300) + 'px';
    tip.style.top = Math.min(e.clientY + 14, innerHeight - 80) + 'px';
  });

  syncFilterInputs();
  syncURL();
  render();
}
init();
</script>
